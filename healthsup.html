<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫用營養品導覽系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background: #fdfdfd; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        
        /* 產品卡片懸浮效果 */
        .product-card {
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: 1px solid #f0f0f0;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            border-color: #3b82f6;
        }

        .img-box {
            width: 100%; height: 220px;
            display: flex; align-items: center; justify-content: center;
            background: #fff; padding: 20px;
        }
        .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* 按鈕樣式 */
        .btn-filter {
            transition: all 0.3s;
            border: 1px solid #e2e8f0;
        }
        .btn-filter.active {
            background: #1e293b;
            color: white;
            border-color: #1e293b;
            transform: scale(1.05);
        }

        /* 詳細視窗動畫 */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-show { opacity: 1; transform: scale(1); }
    </style>
</head>
<body class="text-slate-800">

    <nav class="glass-nav sticky top-0 z-50 border-b border-slate-100 px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black tracking-tighter text-slate-900">HEALTH<span class="text-blue-600">GUIDE</span></h1>
                <p class="text-[10px] font-bold text-slate-400 tracking-[0.2em] uppercase">專業營養補充手冊</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex bg-slate-100 p-1 rounded-full">
                    <button onclick="adjustFont(-2)" class="w-8 h-8 flex items-center justify-center hover:bg-white rounded-full transition text-xs font-bold">A-</button>
                    <button onclick="adjustFont(2)" class="w-8 h-8 flex items-center justify-center hover:bg-white rounded-full transition text-xs font-bold">A+</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 md:p-12" id="app">
        
        <div class="mb-12">
            <h2 class="text-center text-slate-400 text-xs font-black tracking-[0.3em] uppercase mb-6">按臨床科別過濾</h2>
            <div id="filter-bar" class="flex flex-wrap justify-center gap-3">
                <button onclick="filter('全部', this)" class="btn-filter active px-8 py-3 rounded-full text-sm font-bold">全部</button>
                <button onclick="filter('內科', this)" class="btn-filter px-8 py-3 rounded-full text-sm font-bold bg-white">內科</button>
                <button onclick="filter('外科', this)" class="btn-filter px-8 py-3 rounded-full text-sm font-bold bg-white">外科</button>
                <button onclick="filter('婦產科', this)" class="btn-filter px-8 py-3 rounded-full text-sm font-bold bg-white">婦產科</button>
                <button onclick="filter('小兒科', this)" class="btn-filter px-8 py-3 rounded-full text-sm font-bold bg-white">小兒科</button>
                <button onclick="filter('骨科', this)" class="btn-filter px-8 py-3 rounded-full text-sm font-bold bg-white">骨科</button>
            </div>
        </div>

        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <div id="modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="bg-white w-full max-w-xl rounded-[2.5rem] shadow-2xl relative z-10 overflow-hidden transform scale-95 transition-all duration-300" id="modal-box">
            <div id="modal-content" class="p-8 md:p-12 max-h-[80vh] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const products = [
            { id: "HEA-0001", name: "維生素D3液劑", dept: ["婦產科", "小兒科", "骨科", "內科"], effect: "增進鈣吸收，幫助骨骼與牙齒發育", ingred: "橄欖油、維生素D3、莓果香料", usage: "每日 0.2-0.3 毫升", spec: "30 毫升/瓶", target: "孕婦、嬰幼兒、補養者", origin: "西班牙" },
            { id: "HEA-0012", name: "寶乖亞D-PLUS", dept: ["小兒科"], effect: "益生菌維持腸道健康、免疫力", ingred: "羅伊氏乳酸桿菌、維生素D3", usage: "每日 5 滴", spec: "10 毫升/瓶", target: "新生兒、幼童", origin: "瑞典" },
            { id: "HEA-0016", name: "新鐵多滴劑", dept: ["小兒科", "婦產科"], effect: "鐵質補充，有助紅血球形成", ingred: "焦磷酸鐵", usage: "依體重計算滴數", spec: "4.5 公克/罐", target: "嬰幼兒、早產兒", origin: "義大利" },
            { id: "HEA-0010", name: "C+鎂 發泡錠", dept: ["外科", "內科"], effect: "促進膠原蛋白形成、傷口癒合", ingred: "維生素C、氧化鎂", usage: "每日 1 錠", spec: "20 錠/盒", target: "手術後、修復需求者", origin: "德國" },
            { id: "HEA-0017", name: "基速得 (亞培)", dept: ["外科", "內科"], effect: "幫助維持體力、減緩營養耗損", ingred: "L-精胺酸、L-麩醯胺酸", usage: "每日 2 包", spec: "30包/盒", target: "重大傷口、放化療破損", origin: "美國" },
            { id: "HEA-0011", name: "綜合B群發泡錠", dept: ["內科"], effect: "維持心臟及神經系統正常功能", ingred: "綜合維生素、礦物質", usage: "每日 1 錠", spec: "20 錠/盒", target: "疲勞、營養補充者", origin: "德國" },
            { id: "HEA-0006", name: "葉黃素4合1+ B群", dept: ["內科", "婦產科"], effect: "明亮清透保養；維持暗處視覺", ingred: "游離葉黃素 30mg、蝦紅素", usage: "每日 1 粒", spec: "60 粒/裝", target: "病後營養、護眼需求", origin: "德國" },
            { id: "HEA-0015", name: "刻利淨三餐精選組", dept: ["內科", "外科"], effect: "提供低渣餐食，利於檢查排空", ingred: "馬鈴薯燉雞肉等三款餐點", usage: "檢查前配合使用", spec: "595 公克/袋", target: "大腸鏡檢前者", origin: "日本" },
            { id: "HEA-0008", name: "魚油DHA", dept: ["婦產科", "小兒科", "內科"], effect: "幫助思緒清晰、皮膚健康", ingred: "濃縮魚油(DHA 215mg)", usage: "每日 2 粒", spec: "60 粒/盒", target: "孕婦、孩童、老年人", origin: "台灣" },
            { id: "HEA-0009", name: "魚油EPA", dept: ["內科"], effect: "調整體質、維持循環健康", ingred: "高純度魚油 (EPA 400mg)", usage: "每日 2 粒", spec: "60 粒/盒", target: "循環防護需求者", origin: "台灣" },
            { id: "HEA-0014", name: "鎂溶易400MG", dept: ["內科", "外科", "婦產科"], effect: "幫助入睡、助排便、維持肌肉正常", ingred: "氧化鎂 400 毫克", usage: "每日 1 包", spec: "20 包/盒", target: "孕婦、運動員、失眠困擾者", origin: "奧地利" },
            { id: "HEA-0007", name: "淨舒逸甘露醣", dept: ["婦產科", "外科"], effect: "私密處護理、泌尿道保健", ingred: "甘露醣 2000mg", usage: "每日 1-3 包", spec: "12 包/盒", target: "成年女性保養", origin: "德國" },
            { id: "HEA-0002", name: "特適体錠 (鈣)", dept: ["小兒科", "骨科", "內科"], effect: "非晶鈣質營養補充", ingred: "非晶鈣 (碳酸鈣)", usage: "早晚各 1-2 錠", spec: "60 錠/瓶", target: "發育期孩童與成人", origin: "以色列" },
            { id: "HEA-0003", name: "鈣溶易微粒", dept: ["婦產科", "小兒科", "骨科", "內科"], effect: "增進鈣吸收，維持骨骼健康", ingred: "碳酸鈣、D3、K1", usage: "每日 1 包", spec: "20 包/盒", target: "4歲以上孩童、孕婦", origin: "奧地利" },
            { id: "HEA-0004", name: "關立固 (乳油木果)", dept: ["骨科", "外科", "內科"], effect: "行動靈活與活力充沛保養", ingred: "乳油木果萃取", usage: "每日 6 粒", spec: "180 粒/瓶", target: "中高齡關節活力", origin: "日本" },
            { id: "HEA-0005", name: "乳油木果4合一", dept: ["骨科", "外科", "內科"], effect: "靈活關鍵保養，一粒有感", ingred: "葡萄糖胺、MSM、二型膠原", usage: "每日 1-2 粒", spec: "60 粒/裝", target: "銀髮族、關節保養", origin: "美國" }
        ];

        let fontSize = 16;

        function render(data) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = data.map(p => `
                <div class="product-card bg-white rounded-[2rem] overflow-hidden flex flex-col cursor-pointer" onclick="openModal('${p.id}')">
                    <div class="img-box">${getImgHtml(p.id)}</div>
                    <div class="p-8 flex flex-col flex-grow bg-slate-50/30">
                        <div class="flex items-center gap-2 mb-4">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                            <span class="text-[10px] font-black uppercase tracking-tighter text-slate-400">${p.id}</span>
                        </div>
                        <h3 class="text-xl font-bold text-slate-900 mb-2">${p.name}</h3>
                        <p class="text-xs text-slate-500 leading-relaxed line-clamp-2 italic font-light">${p.effect}</p>
                        <div class="mt-8 pt-6 border-t border-slate-100 flex justify-between items-center">
                            <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase">View Details</span>
                            <span class="text-[10px] text-slate-300 font-medium">Made in ${p.origin}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 智慧圖片載入
        function getImgHtml(id) {
            return `<img src="./images/${id}.jpg" onerror="this.onerror=null; this.src='./images/${id}.png'; this.parentElement.innerHTML='<img src=\'./images/${id}.png\' onerror=\'handleImgError(this)\'>';">`;
        }
        function handleImgError(img) { img.src = 'https://via.placeholder.com/300x200?text=Wait+for+Photo'; }

        // 篩選功能：這裡已經將科別歸納到五大類
        function filter(category, btn) {
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (category === '全部') {
                render(products);
            } else {
                const filtered = products.filter(p => p.dept.some(d => d.includes(category)));
                render(filtered);
            }
        }

        function openModal(id) {
            const p = products.find(x => x.id === id);
            const content = `
                <div class="flex justify-between items-start mb-8">
                    <h2 class="text-4xl font-black text-slate-900">${p.name}</h2>
                    <button onclick="closeModal()" class="text-3xl text-slate-300 hover:text-slate-900">&times;</button>
                </div>
                <div class="space-y-8">
                    <div class="bg-blue-50 p-6 rounded-3xl">
                        <p class="text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">主打效能</p>
                        <p class="text-blue-900 text-lg font-medium leading-relaxed">${p.effect}</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 text-sm">
                        <div class="space-y-6">
                            <div><label class="text-slate-400 font-bold text-[10px] uppercase">主要成分</label><p class="mt-1 font-medium text-slate-700">${p.ingred}</p></div>
                            <div><label class="text-slate-400 font-bold text-[10px] uppercase">食用方式</label><p class="mt-1 font-medium text-slate-700">${p.usage}</p></div>
                        </div>
                        <div class="space-y-6">
                            <div><label class="text-slate-400 font-bold text-[10px] uppercase">建議對象</label><p class="mt-1 font-medium text-slate-700">${p.target}</p></div>
                            <div><label class="text-slate-400 font-bold text-[10px] uppercase">包裝規格</label><p class="mt-1 font-medium text-slate-700">${p.spec}</p></div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-content').innerHTML = content;
            document.getElementById('modal').style.opacity = '1';
            document.getElementById('modal').style.pointerEvents = 'auto';
            document.getElementById('modal-box').classList.add('scale-100');
        }

        function closeModal() {
            document.getElementById('modal').style.opacity = '0';
            document.getElementById('modal').style.pointerEvents = 'none';
            document.getElementById('modal-box').classList.remove('scale-100');
        }

        function adjustFont(delta) {
            fontSize += delta;
            document.getElementById('app').style.fontSize = fontSize + 'px';
        }

        window.onload = () => render(products);
    </script>
</body>
</html>
