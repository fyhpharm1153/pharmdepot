<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫用專業營養補充品手冊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background: #fafafa; }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #eee; }
        
        /* 產品卡片設計感 */
        .product-card {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            background: #fff;
            border-radius: 2.5rem;
        }
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px -12px rgba(50, 50, 93, 0.15), 0 18px 36px -18px rgba(0, 0, 0, 0.2);
        }

        .img-container {
            width: 100%; height: 260px; padding: 30px;
            display: flex; align-items: center; justify-content: center;
        }
        .img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* 篩選按鈕樣式 */
        .tab-btn { transition: all 0.3s ease; border: 1px solid #e2e8f0; }
        .tab-btn.active { background: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

        /* 字體縮放控制區 */
        #main-app { transition: font-size 0.2s ease-out; }
    </style>
</head>
<body class="text-slate-800">

    <header class="glass-header sticky top-0 z-50 px-6 py-5">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tighter">NUTRITION<span class="text-blue-600">PRO</span></h1>
                <p class="text-[10px] font-bold text-slate-400 tracking-widest uppercase">全系列產品資訊系統</p>
            </div>
            
            <div class="flex items-center gap-3">
                <span class="text-xs font-bold text-slate-400 mr-2">字體大小控制</span>
                <button onclick="changeFontSize(2)" class="w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-blue-600 hover:text-white rounded-full transition-all font-bold">A+</button>
                <button onclick="changeFontSize(-2)" class="w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-blue-600 hover:text-white rounded-full transition-all font-bold">A-</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 md:p-12" id="main-app">
        
        <div class="flex flex-col items-center mb-16">
            <h2 class="text-xs font-black text-slate-300 tracking-[0.4em] uppercase mb-8 text-center">Department Filter</h2>
            <div id="filter-group" class="flex flex-wrap justify-center gap-3">
                <button onclick="applyFilter('全部', this)" class="tab-btn active px-10 py-3.5 rounded-full text-sm font-black">全部</button>
                <button onclick="applyFilter('內科', this)" class="tab-btn px-10 py-3.5 rounded-full text-sm font-bold bg-white">內科</button>
                <button onclick="applyFilter('外科', this)" class="tab-btn px-10 py-3.5 rounded-full text-sm font-bold bg-white">外科</button>
                <button onclick="applyFilter('婦產科', this)" class="tab-btn px-10 py-3.5 rounded-full text-sm font-bold bg-white">婦產科</button>
                <button onclick="applyFilter('小兒科', this)" class="tab-btn px-10 py-3.5 rounded-full text-sm font-bold bg-white">小兒科</button>
                <button onclick="applyFilter('骨科', this)" class="tab-btn px-10 py-3.5 rounded-full text-sm font-bold bg-white">骨科</button>
            </div>
        </div>

        <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10">
            </div>
    </main>

    <div id="modal-overlay" class="fixed inset-0 z-[100] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="bg-white w-full max-w-2xl rounded-[3rem] shadow-2xl relative z-10 overflow-hidden transform scale-90 transition-all duration-300" id="modal-window">
            <div id="modal-body" class="p-8 md:p-14 max-h-[85vh] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        // 完整 Excel 內容 (16項產品，含所有欄位文字與價格)
        const products = [
            { id: "HEA-0001", name: "維生素D3液劑", ingred: "橄欖油、維生素D3、莓果香料", usage: "每日餐後 0.2-0.3 毫升。抽吸管插入瓶口後倒置抽取。", spec: "30 毫升/瓶 (本包裝含 150 份)", origin: "西班牙", note: "開封後請於 6 個月內食用完畢。多食無益。", effect: "增進鈣吸收，幫助骨骼與牙齒的生長發育，維持神經與肌肉的正常生理。", target: "孕婦產前後、病後補養；嬰幼兒 (可直接滴入寶寶口中)。", dept: ["婦產科", "小兒科", "骨科", "內科"], price: 1200 },
            { id: "HEA-0012", name: "寶乖亞D-PLUS", ingred: "葵花籽油、中鏈三酸甘油酯、羅伊氏乳酸桿菌、維生素D3", usage: "每日一次，每次 5 滴。使用前搖勻 10 秒。", spec: "10 毫升/瓶 (本包裝含 49 份)", origin: "瑞典", note: "食物溫度不得大於 50℃。開封後 3 個月內完食。不可冷凍。", effect: "益生菌與D3雙重補充，改變細菌叢生態，維持健康機能。", target: "需調整體質之嬰幼兒。", dept: ["小兒科"], price: 1650 },
            { id: "HEA-0016", name: "新鐵多滴劑", ingred: "Sucrosomial Iron (焦磷酸鐵、磷脂質、脂肪酸蔗糖酯、辛烯基丁二酸鈉澱粉)", usage: "0.2ml/kg。加入 30ml 水或其他液體中。不須空腹服用。", spec: "4.5 公克/罐", origin: "義大利", note: "粉劑混合後請冷藏，並於一個月內食用完畢。", effect: "鐵質補充，有助於紅血球形成與氧氣輸送。", target: "嬰幼兒、早產兒、純母乳哺育嬰兒、缺鐵貧血兒。", dept: ["小兒科", "婦產科"], price: 2100 },
            { id: "HEA-0010", name: "C+鎂 發泡錠", ingred: "維生素C (225mg)、氧化鎂 (100mg)", usage: "每日 1 錠。放入 150ml 冷水溶解，待溶解後飲用。", spec: "20 錠/盒", origin: "德國", note: "黑醋栗口味。儲存溫度不超過 25℃。", effect: "促進膠原蛋白形成、傷口癒合、具抗氧化作用、維持肌肉及神經正常功能。", target: "一般民眾、手術後需傷口修復者。", dept: ["外科", "內科"], price: 420 },
            { id: "HEA-0017", name: "基速得 (亞培)", ingred: "L-精胺酸、L-麩醯胺酸、HMB", usage: "每日 2 包。每包加入 237-290ml 涼水。不可用熱水。", spec: "24 公克/包 (30包/盒)", origin: "美國", note: "苯酮尿症及敗血症者不宜使用。勿由靜脈注射。", effect: "幫助維持體力、減緩營養耗損。", target: "燒燙傷、壓瘡、糖友傷口、放化療破損、手術傷口。", dept: ["外科", "內科"], price: 4200 },
            { id: "HEA-0011", name: "綜合B群發泡錠", ingred: "綜合維生素(A-K1)、礦物質、葉黃素", usage: "每日 1 錠。放入 200ml 冷水溶解飲用。", spec: "20 錠/盒", origin: "德國", note: "熱帶水果口味。無糖、無阿斯巴甜。", effect: "維持皮膚、心臟及神經系統正常功能。", target: "容易疲勞、工作繁忙、需綜合營養補充之民眾。", dept: ["內科"], price: 450 },
            { id: "HEA-0006", name: "葉黃素4合1+ B群", ingred: "游離葉黃素 30mg、蝦紅素、B群、鋅", usage: "每日 1 粒，飯後溫水食用。", spec: "60 粒/裝", origin: "德國", note: "含大豆、豬皮(明膠)。多食無益。", effect: "明亮清透保養；有助維持暗處視覺。", target: "孕產婦、病後補養、需護眼之一般民眾。", dept: ["內科", "婦產科"], price: 1600 },
            { id: "HEA-0015", name: "刻利淨三餐組", ingred: "馬鈴薯燉雞肉、白粥、雞肉蛋粥", usage: "隔水加熱 3-5 分或拆袋微波加熱。", spec: "595 公克/袋 (含三款餐點)", origin: "日本", note: "含蛋、魚、大豆、麩質。整袋不可微波。", effect: "提供專業低渣餐食，利於腸道排空檢查。", target: "大腸鏡檢前需低渣飲食控制者。", dept: ["內科", "外科"], price: 550 },
            { id: "HEA-0008", name: "魚油DHA", ingred: "濃縮魚油(DHA 215mg)、維生素E", usage: "每日 2 粒，餐後溫水食用。", spec: "60 粒/盒", origin: "台灣", note: "確實遵循建議量食用，多食無益。", effect: "增進皮膚與血球健康；幫助思緒清晰。", target: "孕婦、孩童、老年人、哺乳婦女。", dept: ["婦產科", "小兒科", "內科"], price: 1200 },
            { id: "HEA-0009", name: "魚油EPA", ingred: "高純度魚油 (EPA 400mg)、維生素E", usage: "每日一次，每次 2 粒。", spec: "60 粒/盒", origin: "台灣", note: "含魚類製品。建議開封後 6 個月內完食。", effect: "調整體質、維持良好循環與健康。", target: "需加強循環防護、日常保養之成年人。", dept: ["內科"], price: 1500 },
            { id: "HEA-0014", name: "鎂溶易400MG", ingred: "氧化鎂 (鎂離子 400 毫克)", usage: "每日 1 包。直接倒入口中，無須配水。", spec: "20 包/盒", origin: "奧地利", note: "含阿斯巴甜。全素可食。", effect: "幫助入睡、助排便順暢、維持肌肉正常。", target: "孕授乳婦、運動員、睡眠排便困擾者。", dept: ["內科", "外科", "婦產科"], price: 850 },
            { id: "HEA-0007", name: "淨舒逸甘露醣", ingred: "甘露醣 2000mg、樺樹葉萃取、維生素D3/A", usage: "加強 3 包/日；日常 1 包/日。配水 200ml。", spec: "12 包/盒", origin: "德國", note: "14歲以下不宜。全素可食。", effect: "改變細菌叢生態、維持私密處健康機能。", target: "成年女性、私密保養需求者。", dept: ["婦產科", "外科"], price: 1100 },
            { id: "HEA-0002", name: "特適体錠 (鈣)", ingred: "非晶鈣 (碳酸鈣等)", usage: "平日早晚各 1 錠；發育期早晚各 2 錠。", spec: "60 錠/瓶", origin: "以色列", note: "切勿冷藏。多食無益。", effect: "高吸收率鈣質補充，維持骨骼與牙齒健康。", target: "發育期孩童及一般成人。", dept: ["小兒科", "骨科", "內科"], price: 2100 },
            { id: "HEA-0003", name: "鈣溶易口腔崩散微粒", ingred: "碳酸鈣、維生素D3、K1、C、E", usage: "每日 1 包。直接倒入口中，無須配水。", spec: "20 包/盒", origin: "奧地利", note: "含阿斯巴甜。全素可食。", effect: "補充高鈣與多種維生素，維持骨骼健康。", target: "4歲以上孩童、孕婦、授乳婦。", dept: ["婦產科", "小兒科", "骨科", "內科"], price: 750 },
            { id: "HEA-0004", name: "關立固 (乳油木果)", ingred: "乳油木果萃取 SheaFlex75™", usage: "每日一次 6 粒。可咬破與食物併食。", spec: "180 粒/瓶", origin: "日本", note: "全素可食。開封後請於三個月內食完。", effect: "提供行動靈活與關節保養。", target: "中高齡族群、關節活力保養需求。", dept: ["骨科", "外科", "內科"], price: 2880 },
            { id: "HEA-0005", name: "乳油木果4合一", ingred: "葡萄糖胺、MSM、二型膠原、乳油木果", usage: "每日 1 至 2 粒。", spec: "60 粒/裝", origin: "美國", note: "含 MSM，應避免睡前服用。含甲殼類過敏原。", effect: "關鍵靈活保養，全方位關節營養。", target: "銀髮族、需活動力保養之成人。", dept: ["骨科", "外科", "內科"], price: 1400 }
        ];

        let currentSize = 16;

        function renderProducts(data) {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = data.map(p => `
                <div class="product-card overflow-hidden flex flex-col cursor-pointer" onclick="showDetail('${p.id}')">
                    <div class="img-container">${getImgHtml(p.id)}</div>
                    <div class="p-8 flex-grow flex flex-col">
                        <span class="text-[9px] font-black tracking-widest text-blue-500 mb-2">${p.id}</span>
                        <h3 class="text-xl font-black text-slate-800 mb-3">${p.name}</h3>
                        <p class="text-xs text-slate-400 font-medium line-clamp-2 italic mb-6">${p.effect}</p>
                        
                        <div class="mt-auto flex justify-between items-end border-t border-slate-50 pt-5">
                            <div>
                                <p class="text-[8px] font-black text-slate-300 uppercase">Price</p>
                                <p class="text-2xl font-black text-slate-900">$${p.price}</p>
                            </div>
                            <span class="text-[9px] bg-slate-50 text-slate-400 px-3 py-1 rounded-full font-bold">DETAIL</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 圖片格式支援: jpg -> png
        function getImgHtml(id) {
            return `<img src="./images/${id}.jpg" onerror="this.onerror=null; this.src='./images/${id}.png'; this.parentElement.innerHTML='<img src=\'./images/${id}.png\' onerror=\'handleImgError(this)\'>';">`;
        }
        function handleImgError(img) { img.src = 'https://via.placeholder.com/300x260?text=Product+Image'; }

        // 字體放大縮小 (修復版本)
        function changeFontSize(delta) {
            currentSize += delta;
            if (currentSize < 12) currentSize = 12;
            if (currentSize > 30) currentSize = 30;
            document.getElementById('main-app').style.fontSize = currentSize + 'px';
            // 讓價格標題等小字也等比縮放
            document.querySelectorAll('.text-[9px]').forEach(el => el.style.fontSize = (currentSize * 0.6) + 'px');
        }

        // 篩選邏輯
        function applyFilter(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filtered = (cat === '全部') ? products : products.filter(p => p.dept.some(d => d.includes(cat)));
            renderProducts(filtered);
        }

        function showDetail(id) {
            const p = products.find(x => x.id === id);
            const content = `
                <div class="flex justify-between items-start mb-8">
                    <div>
                        <span class="text-xs font-bold text-blue-600">${p.id}</span>
                        <h2 class="text-4xl font-black text-slate-900 mt-1">${p.name}</h2>
                    </div>
                    <button onclick="closeModal()" class="text-4xl text-slate-200 hover:text-slate-900 transition-colors">&times;</button>
                </div>
                
                <div class="space-y-8">
                    <div class="bg-blue-600 p-8 rounded-[2rem] text-white shadow-xl shadow-blue-100">
                        <p class="text-[10px] font-bold opacity-60 uppercase tracking-widest mb-2">主要保健效果 / Key Efficacy</p>
                        <p class="text-xl font-medium leading-relaxed">${p.effect}</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-8">
                        <div><p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">主要成分</p><p class="text-slate-700 leading-relaxed font-medium">${p.ingred}</p></div>
                        <div><p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">適合對象</p><p class="text-slate-700 leading-relaxed font-medium">${p.target}</p></div>
                        <div><p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">食用方法 / 規格</p><p class="text-slate-700 leading-relaxed font-medium">${p.usage}<br><b>(${p.spec})</b></p></div>
                        <div><p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">產地與注意事項</p><p class="text-slate-700 leading-relaxed font-medium">產地：${p.origin}<br><span class="text-red-500 text-xs">${p.note}</span></p></div>
                    </div>

                    <div class="pt-8 border-t border-slate-100 flex justify-between items-center">
                        <p class="text-3xl font-black text-slate-900">$${p.price}</p>
                        <span class="text-xs font-bold text-blue-100 bg-blue-600 px-6 py-2 rounded-full uppercase tracking-widest">Medical Grade</span>
                    </div>
                </div>
            `;
            document.getElementById('modal-body').innerHTML = content;
            document.getElementById('modal-overlay').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('modal-window').classList.add('scale-100');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('modal-window').classList.remove('scale-100');
        }

        window.onload = () => renderProducts(products);
    </script>
</body>
</html>
