<!DOCTYPE html>
<html lang="zh-TW" style="font-size: 16px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫用專業營養補充品手冊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background: #fafafa; -webkit-text-size-adjust: 100%; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid #eee; }
        .product-card { transition: all 0.4s ease; background: #fff; border-radius: 2rem; border: 1px solid #f0f0f0; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); border-color: #3b82f6; }
        .img-container { width: 100%; height: 240px; padding: 20px; display: flex; align-items: center; justify-content: center; background: #fff; }
        .img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .tab-btn { transition: all 0.2s; border: 1px solid #e2e8f0; white-space: nowrap; }
        .tab-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
        /* 強制彈窗內的文字換行 */
        .full-text { word-break: break-all; white-space: normal; line-height: 1.8; }
    </style>
</head>
<body class="text-slate-800">

    <header class="glass-header sticky top-0 z-50 px-4 py-4 md:px-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-slate-900 tracking-tighter">NUTRITION<span class="text-blue-600">PRO</span></h1>
            <div class="flex items-center gap-2">
                <button onclick="changeFontSize(2)" class="w-10 h-10 flex items-center justify-center bg-slate-100 rounded-full font-bold active:scale-90">A+</button>
                <button onclick="changeFontSize(-2)" class="w-10 h-10 flex items-center justify-center bg-slate-100 rounded-full font-bold active:scale-90">A-</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-10">
        <div class="mb-10 overflow-x-auto">
            <div id="filter-group" class="flex md:justify-center gap-2 pb-2">
                <button onclick="applyFilter('全部', this)" class="tab-btn active px-6 py-2 rounded-full text-sm font-bold">全部</button>
                <button onclick="applyFilter('內科', this)" class="tab-btn bg-white px-6 py-2 rounded-full text-sm font-bold">內科</button>
                <button onclick="applyFilter('外科', this)" class="tab-btn bg-white px-6 py-2 rounded-full text-sm font-bold">外科</button>
                <button onclick="applyFilter('婦產科', this)" class="tab-btn bg-white px-6 py-2 rounded-full text-sm font-bold">婦產科</button>
                <button onclick="applyFilter('小兒科', this)" class="tab-btn bg-white px-6 py-2 rounded-full text-sm font-bold">小兒科</button>
                <button onclick="applyFilter('骨科', this)" class="tab-btn bg-white px-6 py-2 rounded-full text-sm font-bold">骨科</button>
            </div>
        </div>

        <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-8">
            </div>
    </main>

    <div id="modal-overlay" class="fixed inset-0 z-[100] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="absolute inset-0 bg-slate-900/70 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="bg-white w-full max-w-3xl rounded-[2rem] shadow-2xl relative z-10 overflow-hidden transform scale-95 transition-all duration-300" id="modal-window">
            <div id="modal-body" class="p-6 md:p-12 max-h-[90vh] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const products = [
            { id: "HEA-0001", name: "維生素D3液劑", price: 1400, dept: ["婦產科", "小兒科", "骨科", "家醫科", "內科"], ingred: "橄欖油、維生素D3、莓果香料", usage: "每日餐後可食用 0.2 毫升(400IU)，每日勿超過 0.3 毫升(600IU)。抽吸管插入瓶口後，倒置抽取。可直接滴入口中或與食物、水並用。", spec: "30 毫升/瓶 (本包裝含 150 份)", origin: "西班牙", note: "請置於乾燥陰涼處及孩童無法取得處。開封後請於 6 個月內食用完畢。多食無益。", effect: "增進鈣吸收，幫助骨骼與牙齒的生長發育，維持神經與肌肉的正常生理。", target: "孕婦產前後、病後補養；嬰幼兒 (可直接滴入寶寶口中)。" },
            { id: "HEA-0012", name: "寶乖亞D-PLUS", price: 1620, dept: ["小兒科", "小兒腸胃科"], ingred: "葵花籽油、中鏈三酸甘油酯、羅伊氏乳酸桿菌 (L. reuteri DSM 17938)、二氧化矽、維生素D3", usage: "每日一次，每次 5 滴。使用前搖勻 10 秒，可滴在湯匙或加入飲品中。", spec: "10 毫升/瓶 (本包裝含 49 份)", origin: "瑞典", note: "食物溫度不得大於 50℃。開封後 3 個月內食用完畢。不可冷凍。", effect: "益生菌與維生素D雙重補充，改變細菌叢生態並維持發育。", target: "需調整體質之嬰幼兒 (可滴入母乳或配方奶中食用)。" },
            { id: "HEA-0016", name: "新鐵多滴劑", price: 1500, dept: ["小兒科", "新生兒科", "婦產科"], ingred: "Sucrosomial Iron (焦磷酸鐵、米澱粉、脂肪酸蔗糖酯、磷脂醯膽鹼等)", usage: "一般補充：0.2ml/kg；缺鐵症：0.3ml/kg。加入 30 毫升水沖泡。一日請勿超過 2 毫升。", spec: "4.5 公克/罐 (每份 1 毫升，含 30 份)", origin: "義大利", note: "沖泡後請儲存於 4-8℃ 冷藏並於一個月內食用完畢。請勿超過建議量。", effect: "鐵質補充，有助正常紅血球形成與氧氣輸送。", target: "嬰幼兒及早產兒、純母乳哺育嬰兒、缺鐵性貧血兒童。" },
            { id: "HEA-0010", name: "C+鎂 發泡錠", price: 230, dept: ["外科", "整形外科", "皮膚科", "家醫科", "內科"], ingred: "維生素C (225mg)、氧化鎂 (100mg)", usage: "將發泡錠放入 150ml 冷水中，溶解後即可飲用。一日請勿超過 1 錠。", spec: "20 錠/盒 (每份 1 錠)", origin: "德國", note: "瓶蓋內含乾燥劑不可食用。儲存溫度不得超過 25℃。多食無益。黑醋栗口味。", effect: "維生素C能促進膠原蛋白形成、有助傷口癒合及抗氧化；鎂有助身體正常代謝。", target: "一般營養補充民眾；手術後需傷口修復的病患。" },
            { id: "HEA-0017", name: "基速得 (亞培)", price: 8700, dept: ["各次專科外科", "整形外科", "血液腫瘤科", "新陳代謝科", "內科"], ingred: "L-精胺酸 (7g)、L-麩醯胺酸 (7g)、白胺酸代謝物 HMB (1.2g)", usage: "每日建議使用 2 包。每包加入 237 至 290 毫升涼水攪拌溶解。不可使用熱水。", spec: "24 公克/包 (30 包/盒)", origin: "美國", note: "特定疾病配方食品，需經醫師指導。苯酮尿症及敗血症患者不宜。請勿靜脈注射。", effect: "提供特定胺基酸與HMB，幫助維持體力與健康、減緩營養耗損。", target: "燒燙傷/創傷/壓瘡患者、糖尿病傷口管理、放化療引起之口腔黏膜破損、腫瘤耗損或手術長期傷口患者。" },
            { id: "HEA-0011", name: "综合B群發泡錠", price: 500, dept: ["家醫科", "一般內科", "內科"], ingred: "維生素A、B群、C、D3、E、K1、葉酸、菸鹼醯胺、本多酸鈣、生物素、多種礦物質(鋅、鈣、鎂、硒)、葉黃素", usage: "每日一次，每次 1 錠。將發泡錠放入約 200ml 冷水中，溶解後即可飲用。", spec: "20 錠/盒 (每份 1 錠)", origin: "德國", note: "請置於乾燥陰涼處保存，及孩童不易接觸處。無糖、無阿斯巴甜。熱帶水果口味。", effect: "幫助維持皮膚、心臟及神經系統正常功能，有助紅血球形成與生長發育。", target: "容易疲勞、需全方位綜合維生素補充之一般民眾。" },
            { id: "HEA-0006", name: "葉黃素4合1+ B群", price: 1100, dept: ["眼科", "婦產科", "家醫科", "內科"], ingred: "金盞花萃取物(含游離葉黃素 30mg)、枸杞萃取物、山桑子萃取物、紅藻萃取物(含蝦紅素 6.7mg)、維生素A、B1、B6、B12、鋅", usage: "每日 1 粒。多食無益。", spec: "60 粒/裝 (每份 1 粒 0.9 公克)", origin: "德國", note: "本產品含有大豆及其製品。膠囊主原料之明膠由豬皮製成，素食者勿食。", effect: "明亮清透保養；維生素A有助維持在暗處視覺。", target: "孕婦產前產後、病後營養補充及一般護眼需求民眾。" },
            { id: "HEA-0015", name: "刻利淨三餐精選組", price: 980, dept: ["腸胃內科", "大腸直腸外科", "健檢中心", "內科", "外科"], ingred: "馬鈴薯燉雞肉、白粥、雞肉蛋粥 (含鮭魚、雞肉、蔬菜、醬油等)", usage: "隔水加熱：放入沸水中加熱 3-5 分鐘。微波：倒入容器，加熱約 50 秒至 1 分 30 秒。", spec: "595 公克/袋 (含三款餐點各一)", origin: "日本", note: "本產品含蛋、魚、大豆、麩質穀類過敏原。不可將整袋直接放入微波爐。", effect: "提供專業的低渣餐食以利腸道排空檢驗。", target: "大腸鏡檢前需要進行低渣飲食控制的病患。" },
            { id: "HEA-0008", name: "魚油DHA", price: 650, dept: ["婦產科", "小兒科", "神經內科", "內科"], ingred: "濃縮深海魚油(含DHA 215mg / EPA 23.65mg)、亞麻仁油、維生素E", usage: "每日 2 粒，於餐後以溫水搭配食用。一日請勿超過 2 粒。", spec: "60 粒/盒 (每份 2 粒)", origin: "台灣", note: "請確實遵循每日建議量食用，多食無益。", effect: "增進皮膚與血球健康；幫助思緒清晰、學習成長。", target: "特別適合孕婦、孩童與老年人；孕哺婦女補充以支持胎嬰兒生長發育。" },
            { id: "HEA-0009", name: "魚油EPA", price: 1050, dept: ["心臟內科", "神經內科", "家醫科", "內科"], ingred: "魚油 (Omega-3 80%以上、EPA 400mg、DHA 140mg)、維生素E", usage: "每日一次，每次 2 粒。", spec: "60 粒/盒 (每份 2 粒)", origin: "台灣", note: "本產品含有魚類製品。開封後請確實關緊瓶蓋，並儘快於 6 個月內食用完畢。", effect: "高濃度EPA調整體質、維持良好循環與健康。", target: "需加強循環防護、日常保養之一般成年人。" },
            { id: "HEA-0014", name: "鎂溶易400MG口腔崩散微粒", price: 580, dept: ["神經內科(睡眠)", "腸胃科(排便)", "復健科", "婦產科", "內科", "外科"], ingred: "氧化鎂 (鎂離子 400 毫克)、檸檬酸鈉、甜味劑(D-山梨醇、阿斯巴甜、醋磺內酯鉀)", usage: "成人(含孕婦)每日 1 包。建議餐後、睡前或運動前後食用。直接倒入口中，無須配水。", spec: "20 包/盒 (每份 1.3 公克)", origin: "奧地利", note: "本品含阿斯巴甜，苯酮尿症患者不宜使用。全素可食。", effect: "幫助骨骼發育與維持肌肉正常、幫助入睡、有助排便順暢。", target: "4歲以上孩童、孕/授乳婦、運動員(運動前後)，以及睡眠或排便困擾者。" },
            { id: "HEA-0007", name: "淨舒逸甘露醣", price: 1100, dept: ["婦產科", "泌尿科", "外科"], ingred: "甘露醣(2000毫克)、樺樹葉萃取物、維生素D3、維生素A、碳酸鈣", usage: "加強保養：每日 3 包；日常保養：每日 1 包。倒入 200 毫升常溫水攪拌後飲用。", spec: "12 包/盒 (每份 1 包)", origin: "德國", note: "請勿給 14 歲以下孩童使用。本品含阿斯巴甜，苯酮尿症者禁止使用。全素可食。", effect: "改變細菌叢生態並維持健康、調節生理機能；提升排尿量；防護私密煩惱。", target: "成年女性、有泌尿道或私密處保養需求者。(14歲以下孩童不建議使用)。" },
            { id: "HEA-0002", name: "特適体錠", price: 2400, dept: ["小兒科(發育)", "骨科", "內分泌科", "家醫科", "內科"], ingred: "非晶鈣 (碳酸鈣、水、多磷酸鈉、二氧化矽、氯化鈉、檸檬酸)、微結晶纖維素、聚乙烯吡咯烷酮、硬脂酸鎂", usage: "平日保健(發育期前)：早晚各 1 錠；特殊時期或青春發育期：早晚各 2 錠。餐前餐後食用皆可，一日請勿超過 4 錠。", spec: "60 錠/瓶 (每份 1 錠 1 公克)", origin: "以色列", note: "請置於室內陰涼乾燥處，切勿冷藏。多食無益。", effect: "鈣質營養補充。", target: "平日保健、特殊時期、青春發育期的孩童(女生6歲起/男生7歲起)與成人。" },
            { id: "HEA-0003", name: "鈣溶易口腔崩散微粒", price: 520, dept: ["婦產科", "小兒科", "骨科", "家醫科", "內科"], ingred: "碳酸鈣、維生素D3、維生素K1、維生素C、維生素E、D-山梨醇、D-木醣醇", usage: "四歲以上(含孕婦及授乳婦)，建議餐後分次直接倒入口中，無須配水，每日 1 包。", spec: "20 包/盒 (每份 2.4 公克)", origin: "奧地利", note: "本品含阿斯巴甜，苯酮尿症患者不宜使用。請存放於陰涼乾燥處及孩童無法取得處。全素可食。", effect: "補充高鈣質，增進鈣吸收以維持骨骼健康。", target: "4歲以上孩童、孕婦及授乳婦。" },
            { id: "HEA-0004", name: "關立固", price: 2680, dept: ["骨科", "復健科", "高齡醫學", "家醫科", "內科"], ingred: "乳油木果萃取 SheaFlex75™", usage: "每日一次，每次 6 粒。可與餐點併食或餐後搭配開水逐粒吞食。", spec: "180 粒/瓶 (每份 6 粒 3.3 公克)", origin: "日本", note: "請置於室內陰涼乾燥處。如有吞嚥困難，可咬破膠囊與食物一起食用。全素可食。", effect: "提供行動靈活與活力充沛之保養。", target: "需維持關節活力之中高齡族群、一般民眾。" },
            { id: "HEA-0005", name: "乳油木果4合一", price: 1300, dept: ["骨科", "復健科", "高齡醫學", "家醫科", "內科"], ingred: "葡萄糖胺、乳油木果、MSM、非變性二型膠原蛋白、綠唇貽貝萃取、鹿茸、龜粉末、鳳梨酵素、鈣、維生素E、B群、D3", usage: "每日一次，每次 1 至 2 粒。", spec: "60 粒/裝 (每份 1 粒 1.7 公克)", origin: "美國", note: "本產品含有大豆、蟹、魚類及其製品，過敏體質者不宜食用。含 MSM 應避免睡前服用。孕婦及哺乳期婦女使用前應諮詢醫師。膠囊含豬皮成分，素食者勿食。", effect: "提供靈活關鍵保養，訴求「一粒有感」。", target: "需關節活動力保養之成人/銀髮族。(孕婦、哺乳婦女需先諮詢醫師；對甲殼類過敏者不宜)。" }
        ];

        let baseFontSize = 16;

        function changeFontSize(delta) {
            baseFontSize += delta;
            if (baseFontSize < 10) baseFontSize = 10;
            if (baseFontSize > 36) baseFontSize = 36;
            document.documentElement.style.fontSize = baseFontSize + 'px';
        }

        function getImgHtml(id) {
            return `<img src="./images/${id}.jpg" onerror="this.onerror=null; this.src='./images/${id}.png'; this.parentElement.innerHTML='<img src=\'./images/${id}.png\' onerror=\'handleImgError(this)\'>';">`;
        }
        function handleImgError(img) { img.src = 'https://via.placeholder.com/300x240?text=圖片整理中'; }

        function renderProducts(data) {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = data.map(p => `
                <div class="product-card flex flex-col cursor-pointer overflow-hidden" onclick="showDetail('${p.id}')">
                    <div class="img-container">${getImgHtml(p.id)}</div>
                    <div class="p-6 flex-grow flex flex-col">
                        <span class="text-[0.6rem] font-black text-blue-500 mb-1 tracking-widest">${p.id}</span>
                        <h3 class="text-lg font-bold text-slate-900 mb-2 line-clamp-1">${p.name}</h3>
                        <p class="text-[0.75rem] text-slate-500 line-clamp-2 mb-4 leading-relaxed">${p.effect}</p>
                        <div class="mt-auto pt-4 border-t border-slate-50 flex justify-between items-end">
                            <span class="text-xl font-black text-slate-900">$${p.price}</span>
                            <span class="text-[0.6rem] bg-slate-100 text-slate-400 px-3 py-1 rounded-full font-bold">查看詳情</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function applyFilter(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(cat === '全部' ? products : products.filter(p => p.dept.some(d => d.includes(cat))));
        }

        function showDetail(id) {
            const p = products.find(x => x.id === id);
            document.getElementById('modal-body').innerHTML = `
                <div class="flex justify-between items-start mb-8">
                    <div>
                        <span class="text-xs font-bold text-blue-600">${p.id}</span>
                        <h2 class="text-3xl font-black text-slate-900 mt-1">${p.name}</h2>
                    </div>
                    <button onclick="closeModal()" class="text-4xl text-slate-200 hover:text-slate-900 transition-colors">&times;</button>
                </div>
                
                <div class="space-y-8 full-text text-[0.95rem]">
                    <div class="bg-blue-600 p-6 md:p-8 rounded-[1.5rem] text-white shadow-xl shadow-blue-100">
                        <p class="text-xs font-bold opacity-70 uppercase tracking-widest mb-2">主要保健效果</p>
                        <p class="text-lg font-medium leading-relaxed">${p.effect}</p>
                    </div>

                    <div class="grid grid-cols-1 gap-y-6">
                        <div class="border-l-4 border-blue-100 pl-4">
                            <p class="text-xs font-bold text-slate-400 uppercase mb-1">主要成分</p>
                            <p class="text-slate-700 font-medium">${p.ingred}</p>
                        </div>
                        <div class="border-l-4 border-blue-100 pl-4">
                            <p class="text-xs font-bold text-slate-400 uppercase mb-1">食用方法</p>
                            <p class="text-slate-700 font-medium">${p.usage}</p>
                        </div>
                        <div class="border-l-4 border-blue-100 pl-4">
                            <p class="text-xs font-bold text-slate-400 uppercase mb-1">內容包裝規格</p>
                            <p class="text-slate-700 font-medium">${p.spec}</p>
                        </div>
                        <div class="border-l-4 border-blue-100 pl-4">
                            <p class="text-xs font-bold text-slate-400 uppercase mb-1">適合對象</p>
                            <p class="text-slate-700 font-medium">${p.target}</p>
                        </div>
                        <div class="border-l-4 border-blue-100 pl-4">
                            <p class="text-xs font-bold text-slate-400 uppercase mb-1">原產地</p>
                            <p class="text-slate-700 font-medium font-bold">${p.origin}</p>
                        </div>
                        <div class="bg-red-50 p-5 rounded-2xl">
                            <p class="text-xs font-bold text-red-400 uppercase mb-1">注意事項</p>
                            <p class="text-red-600 font-medium text-sm leading-relaxed">${p.note}</p>
                        </div>
                    </div>

                    <div class="pt-8 border-t border-slate-100 flex justify-between items-center">
                        <p class="text-4xl font-black text-slate-900">$${p.price}</p>
                        <span class="text-xs font-bold text-blue-600 bg-blue-50 px-6 py-2 rounded-full uppercase tracking-widest">Medical Choice</span>
                    </div>
                </div>
            `;
            document.getElementById('modal-overlay').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('modal-window').classList.add('scale-100');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('modal-window').classList.remove('scale-100');
        }

        window.onload = () => renderProducts(products);
    </script>
</body>
</html>
