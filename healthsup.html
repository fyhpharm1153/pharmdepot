<!DOCTYPE html>
<html lang="zh-TW" style="font-size: 16px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫用專業營養補充品手冊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background: #fafafa; }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #eee; }
        
        .product-card {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            background: #fff;
            border-radius: 2.5rem;
        }
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px -12px rgba(50, 50, 93, 0.15);
        }

        .img-container {
            width: 100%; height: 260px; padding: 30px;
            display: flex; align-items: center; justify-content: center;
        }
        .img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .tab-btn { transition: all 0.3s ease; border: 1px solid #e2e8f0; }
        .tab-btn.active { background: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

        /* 防止縮放時圖片變形 */
        img { max-width: 100%; height: auto; }
    </style>
</head>
<body class="text-slate-800">

    <header class="glass-header sticky top-0 z-50 px-6 py-5">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tighter">NUTRITION<span class="text-blue-600">PRO</span></h1>
                <p class="text-[10px] font-bold text-slate-400 tracking-widest uppercase">全系列產品資訊系統</p>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="changeFontSize(1)" class="w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-blue-600 hover:text-white rounded-full transition-all font-bold">A+</button>
                <button onclick="changeFontSize(-1)" class="w-10 h-10 flex items-center justify-center bg-slate-100 hover:bg-blue-600 hover:text-white rounded-full transition-all font-bold">A-</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 md:p-12">
        
        <div class="flex flex-col items-center mb-16">
            <h2 class="text-xs font-black text-slate-300 tracking-[0.4em] uppercase mb-8 text-center">Department Filter</h2>
            <div id="filter-group" class="flex flex-wrap justify-center gap-3">
                <button onclick="applyFilter('全部', this)" class="tab-btn active px-8 py-3 rounded-full text-sm font-black">全部</button>
                <button onclick="applyFilter('內科', this)" class="tab-btn px-8 py-3 rounded-full text-sm font-bold bg-white">內科</button>
                <button onclick="applyFilter('外科', this)" class="tab-btn px-8 py-3 rounded-full text-sm font-bold bg-white">外科</button>
                <button onclick="applyFilter('婦產科', this)" class="tab-btn px-8 py-3 rounded-full text-sm font-bold bg-white">婦產科</button>
                <button onclick="applyFilter('小兒科', this)" class="tab-btn px-8 py-3 rounded-full text-sm font-bold bg-white">小兒科</button>
                <button onclick="applyFilter('骨科', this)" class="tab-btn px-8 py-3 rounded-full text-sm font-bold bg-white">骨科</button>
            </div>
        </div>

        <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10">
            </div>
    </main>

    <div id="modal-overlay" class="fixed inset-0 z-[100] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="bg-white w-full max-w-2xl rounded-[3rem] shadow-2xl relative z-10 overflow-hidden transform scale-90 transition-all duration-300" id="modal-window">
            <div id="modal-body" class="p-8 md:p-12 max-h-[85vh] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        // 更新後的價格與完整資料 (共 16 項)
        const products = [
            { id: "HEA-0001", name: "維生素D3液劑", price: 1400, dept: ["婦產科", "小兒科", "骨科", "內科"], ingred: "橄欖油、維生素D3、莓果香料", usage: "每日 0.2-0.3 毫升", spec: "30 毫升/瓶", origin: "西班牙", effect: "增進鈣吸收，幫助骨骼與牙齒發育。", target: "孕婦、嬰幼兒、補養者", note: "開封後 6 個月內完食。" },
            { id: "HEA-0002", name: "特適体錠 (鈣)", price: 2400, dept: ["小兒科", "骨科", "內科"], ingred: "非晶鈣 (碳酸鈣)", usage: "早晚各 1-2 錠", spec: "60 錠/瓶", origin: "以色列", effect: "高吸收率鈣質補充", target: "發育期孩童與成人", note: "切勿冷藏。" },
            { id: "HEA-0003", name: "鈣溶易微粒", price: 520, dept: ["婦產科", "小兒科", "骨科", "內科"], ingred: "碳酸鈣、D3、K1", usage: "每日 1 包", spec: "20 包/盒", origin: "奧地利", effect: "增進鈣吸收，維持骨骼健康", target: "4歲以上孩童、孕婦", note: "含阿斯巴甜。" },
            { id: "HEA-0004", name: "關立固 (乳油木果)", price: 2680, dept: ["骨科", "外科", "內科"], ingred: "乳油木果萃取", usage: "每日 6 粒", spec: "180 粒/瓶", origin: "日本", effect: "行動靈活與活力保養", target: "中高齡關節活力", note: "可咬破與食物併食。" },
            { id: "HEA-0005", name: "乳油木果4合一", price: 1300, dept: ["骨科", "外科", "內科"], ingred: "葡萄糖胺、MSM、二型膠原", usage: "每日 1-2 粒", spec: "60 粒/裝", origin: "美國", effect: "靈活關鍵保養", target: "銀髮族、關節保養", note: "含 MSM，避免睡前服用。" },
            { id: "HEA-0006", name: "葉黃素4合1+ B群", price: 1100, dept: ["內科", "婦產科"], ingred: "游離葉黃素 30mg、蝦紅素", usage: "每日 1 粒", spec: "60 粒/裝", origin: "德國", effect: "明亮保養；維持暗處視覺", target: "一般民眾、護眼需求", note: "含大豆、豬皮成分。" },
            { id: "HEA-0007", name: "淨舒逸甘露醣", price: 1100, dept: ["婦產科", "外科"], ingred: "甘露醣 2000mg", usage: "每日 1-3 包", spec: "12 包/盒", origin: "德國", effect: "私密處護理、泌尿道保健", target: "成年女性保養", note: "14歲以下不宜。" },
            { id: "HEA-0008", name: "魚油DHA", price: 650, dept: ["婦產科", "小兒科", "內科"], ingred: "濃縮魚油(DHA 215mg)", usage: "每日 2 粒", spec: "60 粒/盒", origin: "台灣", effect: "思緒清晰、皮膚健康", target: "孕婦、孩童、老年人", note: "多食無益。" },
            { id: "HEA-0009", name: "魚油EPA", price: 1050, dept: ["內科"], ingred: "高純度魚油 (EPA 400mg)", usage: "每日 2 粒", spec: "60 粒/盒", origin: "台灣", effect: "維持循環健康", target: "循環防護需求者", note: "含魚類製品。" },
            { id: "HEA-0010", name: "C+鎂 發泡錠", price: 230, dept: ["外科", "內科"], ingred: "維生素C、氧化鎂", usage: "每日 1 錠", spec: "20 錠/盒", origin: "德國", effect: "傷口癒合及抗氧化", target: "手術後、修復者", note: "溶解於冷水後飲用。" },
            { id: "HEA-0011", name: "綜合B群發泡錠", price: 500, dept: ["內科"], ingred: "綜合維生素、礦物質", usage: "每日 1 錠", spec: "20 錠/盒", origin: "德國", effect: "維持心臟及神經系統功能", target: "容易疲勞者", note: "熱帶水果口味。" },
            { id: "HEA-0012", name: "寶乖亞D-PLUS", price: 1620, dept: ["小兒科"], ingred: "羅伊氏乳酸桿菌、D3", usage: "每日 5 滴", spec: "10 毫升/瓶", origin: "瑞典", effect: "腸道健康與免疫力", target: "新生兒、幼童", note: "溫度不可大於 50℃。" },
            { id: "HEA-0014", name: "鎂溶易400MG", price: 580, dept: ["內科", "外科", "婦產科"], ingred: "氧化鎂 400 毫克", usage: "每日 1 包", spec: "20 包/盒", origin: "奧地利", effect: "幫助入睡、助排便", target: "運動員、失眠困擾者", note: "直接倒入口中。" },
            { id: "HEA-0015", name: "刻利淨三餐組", price: 980, dept: ["內科", "外科"], ingred: "馬鈴薯燉雞肉等餐點", usage: "檢查前配合使用", spec: "595 公克/袋", origin: "日本", effect: "低渣餐食，利於鏡檢", target: "大腸鏡檢前者", note: "不可整袋微波。" },
            { id: "HEA-0016", name: "新鐵多滴劑", price: 1500, dept: ["小兒科", "婦產科"], ingred: "焦磷酸鐵", usage: "0.2ml/kg", spec: "4.5 公公/罐", origin: "義大利", effect: "鐵質補充，紅血球形成", target: "嬰幼兒、缺鐵貧血兒", note: "混合後需冷藏。" },
            { id: "HEA-0017", name: "基速得 (亞培)", price: 8700, dept: ["外科", "內科"], ingred: "L-精胺酸、L-麩醯胺酸", usage: "每日 2 包", spec: "30包/盒", origin: "美國", effect: "體力維持、減緩營養耗損", target: "重大傷口、放化療者", note: "不可用熱水。" }
        ];

        let currentBaseFontSize = 16;

        function changeFontSize(delta) {
            currentBaseFontSize += delta;
            if (currentBaseFontSize < 12) currentBaseFontSize = 12;
            if (currentBaseFontSize > 32) currentBaseFontSize = 32;
            document.documentElement.style.fontSize = currentBaseFontSize + 'px';
        }

        function getImgHtml(id) {
            return `<img src="./images/${id}.jpg" onerror="this.onerror=null; this.src='./images/${id}.png'; this.parentElement.innerHTML='<img src=\'./images/${id}.png\' onerror=\'handleImgError(this)\'>';">`;
        }
        function handleImgError(img) { img.src = 'https://via.placeholder.com/300x260?text=Product'; }

        function renderProducts(data) {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = data.map(p => `
                <div class="product-card overflow-hidden flex flex-col cursor-pointer" onclick="showDetail('${p.id}')">
                    <div class="img-container">${getImgHtml(p.id)}</div>
                    <div class="p-8 flex-grow flex flex-col">
                        <span class="text-xs font-black tracking-widest text-blue-500 mb-2 uppercase">${p.id}</span>
                        <h3 class="text-xl font-black text-slate-800 mb-3">${p.name}</h3>
                        <p class="text-sm text-slate-400 font-medium line-clamp-2 italic mb-6">${p.effect}</p>
                        <div class="mt-auto flex justify-between items-end border-t border-slate-50 pt-5">
                            <div>
                                <p class="text-[10px] font-black text-slate-300 uppercase">Price</p>
                                <p class="text-2xl font-black text-slate-900">$${p.price}</p>
                            </div>
                            <span class="text-xs bg-slate-50 text-slate-400 px-3 py-1 rounded-full font-bold uppercase">Detail</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function applyFilter(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(cat === '全部' ? products : products.filter(p => p.dept.some(d => d.includes(cat))));
        }

        function showDetail(id) {
            const p = products.find(x => x.id === id);
            document.getElementById('modal-body').innerHTML = `
                <div class="flex justify-between items-start mb-8">
                    <div><span class="text-xs font-bold text-blue-600">${p.id}</span><h2 class="text-4xl font-black text-slate-900 mt-1">${p.name}</h2></div>
                    <button onclick="closeModal()" class="text-4xl text-slate-200 hover:text-slate-900">&times;</button>
                </div>
                <div class="space-y-8 text-base">
                    <div class="bg-blue-600 p-8 rounded-[2rem] text-white shadow-xl shadow-blue-100">
                        <p class="text-xs font-bold opacity-60 uppercase tracking-widest mb-2">主要保健效果</p>
                        <p class="text-xl font-medium leading-relaxed">${p.effect}</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div><label class="text-xs font-bold text-slate-400 uppercase tracking-widest">主要成分</label><p class="mt-1 text-slate-700 font-medium">${p.ingred}</p></div>
                        <div><label class="text-xs font-bold text-slate-400 uppercase tracking-widest">適合對象</label><p class="mt-1 text-slate-700 font-medium">${p.target}</p></div>
                        <div><label class="text-xs font-bold text-slate-400 uppercase tracking-widest">食用方法 / 規格</label><p class="mt-1 text-slate-700 font-medium">${p.usage} (${p.spec})</p></div>
                        <div><label class="text-xs font-bold text-slate-400 uppercase tracking-widest">產地與注意</label><p class="mt-1 text-slate-700 font-medium">產地：${p.origin}<br><span class="text-red-500">${p.note}</span></p></div>
                    </div>
                    <div class="pt-8 border-t flex justify-between items-center"><p class="text-4xl font-black text-slate-900">$${p.price}</p></div>
                </div>
            `;
            document.getElementById('modal-overlay').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('modal-window').classList.add('scale-100');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('modal-window').classList.remove('scale-100');
        }

        window.onload = () => renderProducts(products);
    </script>
</body>
</html>
