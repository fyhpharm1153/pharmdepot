<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { --p: #2c3e50; --a: #3498db; --s: #27ae60; --r: #e74c3c; }
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; background: var(--p); color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .stat-item { text-align: center; border-right: 1px solid #555; }
        .stat-item:last-child { border: none; }
        .val { font-size: 20px; font-weight: bold; color: #f1c40f; }
        .group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 18px; }
        .spec-box { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn-spec { padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; font-weight: bold; flex: 1; min-width: 70px; }
        .btn-spec.active { border-color: var(--a); background: #e3f2fd; color: var(--a); }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #eee; padding: 10px; border-radius: 10px; }
        .btn-n { padding: 18px; background: white; border: none; border-radius: 8px; font-size: 22px; font-weight: bold; }
        .btn-s { width: 100%; padding: 18px; background: var(--s); color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; margin-top: 15px; }
        
        /* 區間查詢按鈕 */
        .btn-query { width: 100%; background: none; border: 1px solid var(--a); color: var(--a); padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: bold; }

        /* 彈出視窗樣式 */
        .modal { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content { background: white; width: 85%; max-width: 400px; margin: 20% auto; padding: 20px; border-radius: 15px; text-align: center; }
        .modal-title { font-size: 1.2rem; margin-bottom: 15px; color: var(--p); }
        .close-modal { background: var(--p); color: white; padding: 10px 20px; border: none; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h3 style="text-align:center; margin-top:0;">Fentanyl 回收系統 (今日)</h3>
    
    <div id="stat-area" class="summary-grid">載入中...</div>

    <div class="group">
        <label>規格</label>
        <div id="spec-area" class="spec-box"></div>
    </div>

    <div class="group">
        <label>病歷號碼</label>
        <input type="text" id="cn" readonly onclick="setA('cn')" placeholder="點擊輸入">
    </div>

    <div class="group">
        <label>數量</label>
        <input type="text" id="qt" readonly onclick="setA('qt')" placeholder="點擊輸入">
    </div>

    <div class="numpad">
        <script>
            for(let i=1; i<=9; i++) document.write(`<button class="btn-n" onclick="pN('${i}')">${i}</button>`);
        </script>
        <button class="btn-n" onclick="pC()" style="color:var(--r)">C</button>
        <button class="btn-n" onclick="pN('0')">0</button>
        <button class="btn-n" onclick="act=''" style="color:var(--s)">OK</button>
    </div>

    <button id="sb" class="btn-s" onclick="save()">確認送出</button>
    <button class="btn-query" onclick="openModal()">查詢區間總量</button>
</div>

<div id="qModal" class="modal">
    <div class="modal-content">
        <div class="modal-title">查詢區間累計總量</div>
        <input type="date" id="qStart" style="margin-bottom:10px">
        <input type="date" id="qEnd">
        <div id="qResult" style="margin-top:20px; text-align: left; font-size: 1.1rem; border-top: 1px solid #eee; padding-top: 15px;"></div>
        <button class="btn-s" onclick="queryRange()">開始查詢</button>
        <button class="close-modal" onclick="closeModal()">關閉</button>
    </div>
</div>

<script>
    let currentSpec = '';
    let act = 'cn';

    window.onload = () => {
        google.script.run.withSuccessHandler(initUI).withFailureHandler(err => alert("抓不到資料: "+err)).getAppData();
    };

    function initUI(res) {
        if(res.error) return alert("錯誤: " + res.error);
        let statHtml = '';
        for (let s in res.stats) {
            statHtml += `<div class="stat-item">${s}<br><span class="val">${res.stats[s]}</span></div>`;
        }
        document.getElementById('stat-area').innerHTML = statHtml;

        let specHtml = '';
        res.specList.forEach((s, i) => {
            if(i === 0) currentSpec = s;
            specHtml += `<button class="btn-spec ${i===0?'active':''}" onclick="setS('${s}', this)">${s}</button>`;
        });
        document.getElementById('spec-area').innerHTML = specHtml;
    }

    function setS(v, b) {
        currentSpec = v;
        document.querySelectorAll('.btn-spec').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
    }
    function setA(id) { act = id; }
    function pN(n) { if(act) document.getElementById(act).value += n; }
    function pC() { if(act) document.getElementById(act).value = ''; }

    function save() {
        const cn = document.getElementById('cn').value;
        const qt = document.getElementById('qt').value;
        if(!cn || !qt) return alert('請完整輸入');
        document.getElementById('sb').disabled = true;
        
        google.script.run.withSuccessHandler(res => {
            initUI(res);
            document.getElementById('cn').value = '';
            document.getElementById('qt').value = '';
            document.getElementById('sb').disabled = false;
            alert('儲存成功');
        }).saveToSheet({date: new Date().toISOString().split('T')[0], chartNo: cn, spec: currentSpec, qty: qt});
    }

    // 彈窗查詢邏輯
    function openModal() { document.getElementById('qModal').style.display = 'block'; }
    function closeModal() { document.getElementById('qModal').style.display = 'none'; }
    function queryRange() {
        const s = document.getElementById('qStart').value;
        const e = document.getElementById('qEnd').value;
        if(!s || !e) return alert('請選擇日期');
        document.getElementById('qResult').innerHTML = "查詢中...";
        
        google.script.run.withSuccessHandler(stats => {
            let resHtml = '<b>查詢結果：</b><br>';
            for(let key in stats) {
                resHtml += `• ${key} mcg/hr：<b>${stats[key]}</b> 張<br>`;
            }
            document.getElementById('qResult').innerHTML = resHtml;
        }).getRangeStats(s, e);
    }
</script>
</body>
</html>
