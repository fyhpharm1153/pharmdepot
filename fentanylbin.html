<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fentanyl 貼片回收系統</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        /* 當日統計卡片區 */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            background: var(--primary-color);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .stat-item {
            text-align: center;
            border-right: 1px solid rgba(255,255,255,0.2);
        }

        .stat-item:last-child { border: none; }

        .stat-label { font-size: 0.8rem; opacity: 0.8; margin-bottom: 4px; }
        .stat-value { font-size: 1.4rem; font-weight: bold; color: #f1c40f; }

        /* 表單區域 */
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #444; }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #edf2f7;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 18px;
            background: #f9f9f9;
            color: #2d3748;
        }

        input:focus { outline: none; border-color: var(--accent-color); background: #fff; }

        /* 動態規格按鈕 */
        .spec-box { display: flex; flex-wrap: wrap; gap: 10px; }
        .btn-spec {
            flex: 1;
            min-width: 80px;
            padding: 12px;
            border: 2px solid #edf2f7;
            border-radius: 10px;
            background: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-spec.active {
            border-color: var(--accent-color);
            background: #ebf5fb;
            color: var(--accent-color);
            box-shadow: 0 2px 4px rgba(52, 152, 219, 0.2);
        }

        /* 虛擬數字鍵盤 */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            background: #f1f3f5;
            padding: 12px;
            border-radius: 12px;
        }

        .btn-n {
            padding: 18px;
            background: white;
            border: none;
            border-radius: 10px;
            font-size: 22px;
            font-weight: 600;
            box-shadow: 0 2px 0 #cbd5e0;
            cursor: pointer;
        }

        .btn-n:active { background: #e2e8f0; transform: translateY(2px); box-shadow: none; }

        /* 送出按鈕 */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--success-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(39, 174, 96, 0.2);
        }

        .submit-btn:disabled { background: #bdc3c7; cursor: not-allowed; }

        #loading-overlay {
            display: none;
            text-align: center;
            color: var(--accent-color);
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Fentanyl 貼片回收登記</h2>
    
    <div id="stat-area" class="summary-grid">
        <div style="grid-column: 1/-1; text-align: center;">載入數據中...</div>
    </div>

    <div class="form-group">
        <label>藥品規格 (mcg/hr)</label>
        <div id="spec-area" class="spec-box">
            </div>
    </div>

    <div class="form-group">
        <label>病歷號碼</label>
        <input type="text" id="chartNo" readonly onclick="setActiveInput('chartNo')" placeholder="點擊輸入號碼">
    </div>

    <div class="form-group">
        <label>退回張數</label>
        <input type="text" id="qty" readonly onclick="setActiveInput('qty')" placeholder="點擊輸入數量">
    </div>

    <div class="numpad">
        <button class="btn-n" onclick="pressKey('1')">1</button>
        <button class="btn-n" onclick="pressKey('2')">2</button>
        <button class="btn-n" onclick="pressKey('3')">3</button>
        <button class="btn-n" onclick="pressKey('4')">4</button>
        <button class="btn-n" onclick="pressKey('5')">5</button>
        <button class="btn-n" onclick="pressKey('6')">6</button>
        <button class="btn-n" onclick="pressKey('7')">7</button>
        <button class="btn-n" onclick="pressKey('8')">8</button>
        <button class="btn-n" onclick="pressKey('9')">9</button>
        <button class="btn-n" onclick="clearInput()" style="color: #e74c3c;">清除</button>
        <button class="btn-n" onclick="pressKey('0')">0</button>
        <button class="btn-n" onclick="finishInput()" style="color: var(--success-color);">確認</button>
    </div>

    <div id="loading-overlay">⏳ 處理中，請稍候...</div>
    <button id="submitBtn" class="submit-btn" onclick="submitData()">確認送出紀錄</button>
</div>

<script>
    let currentSpec = '';
    let activeInputId = 'chartNo';

    // 1. 初始化讀取後端資料 (規格與統計)
    window.onload = () => {
        refreshData();
    };

    function refreshData() {
        google.script.run.withSuccessHandler(initUI).getAppData();
    }

    function initUI(res) {
        // 生成統計欄位
        let statHtml = '';
        for (let s in res.stats) {
            statHtml += `
                <div class="stat-item">
                    <div class="stat-label">${s}</div>
                    <div class="stat-value" id="sum-${s}">${res.stats[s]}</div>
                </div>`;
        }
        document.getElementById('stat-area').innerHTML = statHtml;

        // 生成規格按鈕
        let specHtml = '';
        res.specList.forEach((s, i) => {
            const activeClass = i === 0 ? 'active' : '';
            if(i === 0 && !currentSpec) currentSpec = s; // 預設選第一個
            specHtml += `<button class="btn-spec ${activeClass}" onclick="setSpec('${s}', this)">${s}</button>`;
        });
        document.getElementById('spec-area').innerHTML = specHtml;
    }

    // 2. 介面互動邏輯
    function setSpec(val, btn) {
        currentSpec = val;
        document.querySelectorAll('.btn-spec').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function setActiveInput(id) {
        activeInputId = id;
        document.querySelectorAll('input').forEach(el => el.style.borderColor = '#edf2f7');
        document.getElementById(id).style.borderColor = 'var(--accent-color)';
    }

    function pressKey(num) {
        const input = document.getElementById(activeInputId);
        input.value += num;
    }

    function clearInput() {
        document.getElementById(activeInputId).value = '';
    }

    function finishInput() {
        if (activeInputId === 'chartNo') {
            setActiveInput('qty');
        } else {
            activeInputId = ''; 
            document.querySelectorAll('input').forEach(el => el.style.borderColor = '#edf2f7');
        }
    }

    // 3. 提交資料到 Google Sheets
    function submitData() {
        const chartNo = document.getElementById('chartNo').value;
        const qty = document.getElementById('qty').value;

        if (!chartNo || !qty) {
            alert('❌ 請完整輸入病歷號碼與張數');
            return;
        }

        // 鎖定 UI
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('loading-overlay').style.display = 'block';

        const payload = {
            date: new Date().toISOString().split('T')[0],
            chartNo: chartNo,
            spec: currentSpec,
            qty: qty
        };

        google.script.run.withSuccessHandler(res => {
            // 更新 UI 統計數據
            for (let s in res.stats) {
                const el = document.getElementById(`sum-${s}`);
                if (el) el.innerText = res.stats[s];
            }
            
            // 清空輸入並恢復按鈕
            document.getElementById('chartNo').value = '';
            document.getElementById('qty').value = '';
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('loading-overlay').style.display = 'none';
            setActiveInput('chartNo');
            
            alert('✅ 儲存成功！資料已同步至雲端。');
        }).saveToSheet(payload);
    }
</script>

</body>
</html>
