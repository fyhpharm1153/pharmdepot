<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫院藥師條碼系統</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --bg: #f4f7f9; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 380px; text-align: center; }
        h2 { color: var(--primary); margin-bottom: 25px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 1.2rem; text-align: center; }
        .btn-main { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1.1rem; cursor: pointer; font-weight: bold; margin-top: 10px; }
        #output-page { display: none; }
        .barcode-box { border: 2px solid #eee; padding: 20px; border-radius: 12px; margin: 20px 0; background: #fff; }
        .qr-flex { display: flex; justify-content: center; margin: 20px 0; }
        .name-display { font-size: 1.8rem; font-weight: bold; color: #333; margin-top: 15px; border-top: 2px solid #eee; padding-top: 15px; }
        .id-display { color: #666; font-size: 1.1rem; margin-top: 5px; }
        .hint { color: #e74c3c; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="login-page">
    <h2>藥師系統登入</h2>
    <div style="margin-bottom: 20px;">
        <label style="color: #666;">請輸入工號 ID</label>
        <input type="text" id="idInput" placeholder="例如: 01234" inputmode="numeric">
    </div>
    <button class="btn-main" id="submitBtn">產生成條碼</button>
</div>

<div class="container" id="output-page">
    <div class="hint">【 請截圖此畫面保存 】</div>
    <div class="barcode-box">
        <svg id="b1d"></svg>
        <div style="margin: 20px 0; border-top: 1px dashed #ddd;"></div>
        <div class="qr-flex" id="b2d"></div>
    </div>
    <div class="name-display" id="showName"></div>
    <div class="id-display">工號：<span id="showID"></span></div>
    <button style="margin-top:20px; background:none; border:none; color:#3498db; text-decoration:underline; cursor:pointer;" onclick="location.reload()">重新輸入</button>
</div>

    let pharmacistDB = {};
    try {
        // 將 Base64 解碼並還原為 JSON 物件
        const decodedData = decodeURIComponent(atob(_data_payload).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        pharmacistDB = JSON.parse(decodedData);
    } catch (e) {
        console.error("資料解析失敗");
    }

    const idInput = document.getElementById('idInput');
    const submitBtn = document.getElementById('submitBtn');

    submitBtn.addEventListener('click', doLogin);
    idInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') doLogin(); });

    function doLogin() {
        let inputID = idInput.value.trim();
        if (!inputID) return;

        let user = pharmacistDB[inputID];
        if (!user && inputID.length === 4) {
            inputID = "0" + inputID;
            user = pharmacistDB[inputID];
        }

        if (user) {
            renderPage(inputID, user.name, user.code);
        } else {
            alert("找不到工號：" + inputID);
        }
    }

    function renderPage(id, name, rawCode) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('output-page').style.display = 'block';
        document.getElementById('showName').innerText = name;
        document.getElementById('showID').innerText = id;

        const cleanCode = rawCode.replace(/\*/g, '');

        JsBarcode("#b1d", cleanCode, {
            format: "CODE128", width: 2.2, height: 85, displayValue: true, fontSize: 18
        });

        const qrDiv = document.getElementById("b2d");
        qrDiv.innerHTML = "";
        new QRCode(qrDiv, { text: cleanCode, width: 180, height: 180 });
    }
</script>
</body>
</html>
