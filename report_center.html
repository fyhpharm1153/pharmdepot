<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>藥品撥補 - 區間查詢中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="p-4 bg-slate-50">
    <div id="app" class="max-w-4xl mx-auto py-8">
        
        <div class="bg-white p-6 rounded-3xl shadow-lg border-2 border-slate-800 mb-8">
            <h2 class="text-2xl font-black mb-6 flex items-center gap-2">
                <i class="fa-solid fa-filter text-blue-600"></i> 選擇匯出區間
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-sm font-bold text-slate-500 mb-2">開始日期</label>
                    <input type="date" v-model="dateRange.start" class="w-full p-4 bg-slate-100 rounded-xl border-2 border-slate-200 font-bold">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-500 mb-2">結束日期</label>
                    <input type="date" v-model="dateRange.end" class="w-full p-4 bg-slate-100 rounded-xl border-2 border-slate-200 font-bold">
                </div>
            </div>

            <button @click="fetchDataByRange" 
                :disabled="loading"
                class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-xl shadow-[4px_4px_0px_0px_rgba(30,58,138,1)] active:translate-y-1 active:shadow-none transition-all disabled:opacity-50">
                <i v-if="loading" class="fa-solid fa-spinner fa-spin mr-2"></i>
                {{ loading ? '資料抓取中...' : '從資料庫抓取資料' }}
            </button>
        </div>

        <div v-if="filteredLogs.length > 0">
            <div class="flex justify-between items-center mb-4">
                <p class="font-bold text-slate-600">找到 {{ filteredLogs.length }} 筆資料</p>
                <button @click="exportToExcel" class="bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold shadow-md hover:bg-emerald-700">
                    <i class="fa-solid fa-file-excel mr-2"></i>匯出區間報表
                </button>
            </div>

            <div class="space-y-3">
                <div v-for="log in filteredLogs" :key="log.id" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                    <div>
                        <div class="text-xs font-bold text-slate-400">{{ log.time }}</div>
                        <div class="font-black text-slate-800">{{ log.name }}</div>
                    </div>
                    <div class="font-black text-blue-600 text-xl">{{ log.qty }}</div>
                </div>
            </div>
        </div>

        <div v-else-if="hasSearched && !loading" class="text-center py-20 text-slate-400 font-bold">
            該區間內查無資料，請更換日期。
        </div>
    </div>

<script type="module">
    import { createApp, ref } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref as dbRef, query, orderByChild, startAt, endAt, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Firebase 配置 (沿用你的設定)
    const firebaseConfig = {
      apiKey: "AIzaSyDZuNztwb9aLG1RqeDOyrj6KJrPhwBFi9M",
      authDomain: "fyh-pharmacy-inventory.firebaseapp.com",
      databaseURL: "https://fyh-pharmacy-inventory-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "fyh-pharmacy-inventory",
      storageBucket: "fyh-pharmacy-inventory.firebasestorage.app",
      messagingSenderId: "751378148626",
      appId: "1:751378148626:web:5a2d2be1c5f905657457cb"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);

    createApp({
        setup() {
            const dateRange = ref({
                start: new Date().toISOString().split('T')[0],
                end: new Date().toISOString().split('T')[0]
            });
            const filteredLogs = ref([]);
            const loading = ref(false);
            const hasSearched = ref(false);

            const fetchDataByRange = async () => {
                loading.value = true;
                hasSearched.value = true;
                
                try {
                    // 將 HTML Date (2026-04-20) 轉為你的 Firebase 格式 (2026/4/20)
                    const formatForFB = (d) => {
                        const parts = d.split('-');
                        return `${parts[0]}/${Number(parts[1])}/${Number(parts[2])}`;
                    };

                    const startStr = formatForFB(dateRange.value.start) + " 00:00:00";
                    const endStr = formatForFB(dateRange.value.end) + " 23:59:59";

                    // 關鍵：使用 Firebase 伺服器端篩選
                    const logsQuery = query(
                        dbRef(db, "transfer_logs"),
                        orderByChild("time"),
                        startAt(startStr),
                        endAt(endStr)
                    );

                    const snapshot = await get(logsQuery);
                    
                    if (snapshot.exists()) {
                        // 轉為陣列並排序
                        const data = Object.entries(snapshot.val()).map(([id, v]) => ({ id, ...v }));
                        filteredLogs.value = data.sort((a, b) => b.time.localeCompare(a.time));
                    } else {
                        filteredLogs.value = [];
                    }
                } catch (error) {
                    console.error("抓取失敗:", error);
                    alert("抓取資料時發生錯誤");
                } finally {
                    loading.value = false;
                }
            };

            const exportToExcel = () => {
                const data = filteredLogs.value.map(l => ({
                    '時間': l.time,
                    '人員': l.user,
                    '藥品名稱': l.name,
                    '數量': l.qty,
                    '類型': l.isSuperUrgent ? '超急' : (l.isUrgent ? '急領' : (l.isER ? '急診' : '一般'))
                }));
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "區間報表");
                XLSX.writeFile(wb, `撥補報表_${dateRange.value.start}_至_${dateRange.value.end}.xlsx`);
            };

            return { dateRange, filteredLogs, loading, hasSearched, fetchDataByRange, exportToExcel };
        }
    }).mount('#app');
</script>
</body>
</html>
