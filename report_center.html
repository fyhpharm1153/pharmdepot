<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藥品撥補 - 近7日看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>[v-cloak] { display: none; }</style>
</head>
<body class="bg-slate-100 p-4 md:p-8">
    <div id="app" v-cloak class="max-w-5xl mx-auto">
        
        <header class="bg-white p-6 rounded-3xl shadow-lg border-2 border-slate-800 mb-8">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-3xl font-black text-slate-800">近 7 日撥補總覽</h1>
                    <p class="text-slate-500 font-bold mt-1">
                        <i class="fa-solid fa-calendar-day mr-2"></i>{{ dateRangeText }}
                    </p>
                </div>
                <div class="flex gap-3">
                    <div class="bg-blue-50 border-2 border-blue-200 p-3 rounded-2xl text-center min-w-[100px]">
                        <div class="text-xs font-bold text-blue-500 uppercase">總筆數</div>
                        <div class="text-2xl font-black text-blue-800">{{ logs.length }}</div>
                    </div>
                    <button @click="exportWeekly" class="bg-emerald-600 text-white px-6 py-3 rounded-2xl font-black shadow-[4px_4px_0px_0px_rgba(5,150,105,1)] active:translate-y-1 active:shadow-none transition-all">
                        <i class="fa-solid fa-file-excel mr-2"></i>匯出週報
                    </button>
                </div>
            </div>
        </header>

        <div v-if="loading" class="text-center py-20">
            <i class="fa-solid fa-circle-notch fa-spin text-5xl text-blue-600 mb-4"></i>
            <p class="text-slate-500 font-black">正在同步近 7 天資料...</p>
        </div>

        <div v-else class="space-y-8">
            <div v-for="(dayLogs, date) in groupedLogs" :key="date">
                <h2 class="text-xl font-black text-slate-700 mb-4 flex items-center gap-2">
                    <span class="bg-slate-800 text-white px-3 py-1 rounded-lg text-sm">{{ date }}</span>
                    <span class="text-slate-400 text-sm">共 {{ dayLogs.length }} 筆</span>
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div v-for="log in dayLogs" :key="log.id" 
                         class="bg-white p-4 rounded-2xl border-2 border-slate-200 shadow-sm hover:border-blue-400 transition-all">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] font-bold text-slate-400">{{ log.time.split(' ')[1] }}</span>
                            <span :class="getTypeClass(log)" class="text-[10px] px-2 py-0.5 rounded-full font-black border">
                                {{ getTypeName(log) }}
                            </span>
                        </div>
                        <div class="font-bold text-slate-500 text-xs mb-1">[{{ log.code }}]</div>
                        <div class="font-black text-slate-800 text-lg leading-tight mb-2">{{ log.name }}</div>
                        <div class="flex justify-between items-end">
                            <span class="text-xs font-bold text-slate-400">人員: {{ log.user }}</span>
                            <span class="text-2xl font-black text-blue-600">{{ log.qty }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    import { createApp, ref, computed, onMounted } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref as dbRef, query, orderByChild, startAt, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZuNztwb9aLG1RqeDOyrj6KJrPhwBFi9M",
      authDomain: "fyh-pharmacy-inventory.firebaseapp.com",
      databaseURL: "https://fyh-pharmacy-inventory-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "fyh-pharmacy-inventory",
      storageBucket: "fyh-pharmacy-inventory.firebasestorage.app",
      messagingSenderId: "751378148626",
      appId: "1:751378148626:web:5a2d2be1c5f905657457cb"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);

    createApp({
        setup() {
            const logs = ref([]);
            const loading = ref(true);
            const today = new Date();
            const sevenDaysAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);

            const dateRangeText = computed(() => {
                const f = (d) => `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
                return `${f(sevenDaysAgo)} ～ ${f(today)}`;
            });

            const fetchData = async () => {
                loading.value = true;
                // 格式化為資料庫字串格式 yyyy/m/d
                const startStr = `${sevenDaysAgo.getFullYear()}/${sevenDaysAgo.getMonth()+1}/${sevenDaysAgo.getDate()} 00:00:00`;
                
                const q = query(dbRef(db, "transfer_logs"), orderByChild("time"), startAt(startStr));
                const s = await get(q);
                
                if (s.exists()) {
                    logs.value = Object.entries(s.val())
                        .map(([id, v]) => ({ id, ...v }))
                        .sort((a, b) => b.time.localeCompare(a.time));
                }
                loading.value = false;
            };

            const groupedLogs = computed(() => {
                const g = {};
                logs.value.forEach(l => {
                    const d = l.time.split(' ')[0];
                    if (!g[d]) g[d] = [];
                    g[d].push(l);
                });
                return g;
            });

            const exportWeekly = () => {
                const data = logs.value.map(l => ({
                    '時間': l.time, '人員': l.user, '代碼': l.code, '藥名': l.name, 
                    '數量': l.qty, '類型': getTypeName(l)
                }));
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "週報表");
                XLSX.writeFile(wb, `近7日撥補紀錄_${new Date().toISOString().split('T')[0]}.xlsx`);
            };

            const getTypeName = (l) => l.isSuperUrgent ? '超急' : (l.isUrgent ? '急領' : (l.isER ? '急診' : '一般'));
            const getTypeClass = (l) => {
                if (l.isSuperUrgent) return 'bg-purple-100 text-purple-700 border-purple-200';
                if (l.isUrgent) return 'bg-orange-100 text-orange-700 border-orange-200';
                if (l.isER) return 'bg-indigo-100 text-indigo-700 border-indigo-200';
                return 'bg-slate-100 text-slate-600 border-slate-200';
            };

            onMounted(fetchData);

            return { logs, loading, dateRangeText, groupedLogs, exportWeekly, getTypeName, getTypeClass };
        }
    }).mount('#app');
</script>
</body>
</html>
