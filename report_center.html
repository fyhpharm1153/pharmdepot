<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藥品撥補 - 歷史報表中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        [v-cloak] { display: none; }
        body { background-color: #f8fafc; font-family: sans-serif; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="app" v-cloak class="max-w-4xl mx-auto">
        <header class="mb-8 flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-black text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-database text-indigo-600"></i>
                    歷史報表查詢中心
                </h1>
                <p class="text-slate-500 font-medium">豐原醫院藥劑科 - 自動分日歸檔系統</p>
            </div>
            <div class="text-right">
                <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm font-bold">
                    總資料量: {{ rawLogs.length }} 筆
                </span>
            </div>
        </header>

        <div v-if="loading" class="text-center py-20">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-500 mb-4"></i>
            <p class="text-slate-500 font-bold">正在從雲端資料庫同步紀錄...</p>
        </div>

        <div v-else class="space-y-4">
            <div v-for="[date, logs] in groupedData" :key="date" 
                 class="bg-white border-2 border-slate-200 rounded-2xl p-5 hover:border-indigo-400 transition-all shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                
                <div class="flex items-center gap-4">
                    <div class="bg-slate-100 w-14 h-14 rounded-xl flex flex-col items-center justify-center border border-slate-200">
                        <span class="text-[10px] font-bold text-slate-400 uppercase leading-none">Date</span>
                        <span class="text-lg font-black text-slate-700">{{ date.split('/')[2] }}</span>
                    </div>
                    <div>
                        <h3 class="text-xl font-black text-slate-800">{{ date }}</h3>
                        <p class="text-slate-500 font-bold text-sm">
                            <i class="fa-solid fa-clipboard-list mr-1"></i>
                            當日共有 {{ logs.length }} 筆撥補紀錄
                        </p>
                    </div>
                </div>

                <div class="flex gap-2 w-full md:w-auto">
                    <button @click="downloadDay(date, logs)" 
                            class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-black shadow-[4px_4px_0px_0px_rgba(5,150,105,0.3)] active:translate-y-0.5 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-file-excel"></i>
                        下載報表
                    </button>
                </div>
            </div>
        </div>

        <footer class="mt-12 text-center text-slate-400 text-sm font-medium">
            &copy; 2026 Feng Yuan Hospital Pharmacy Center
        </footer>
    </div>

<script type="module">
    import { createApp, ref, computed, onMounted } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref as dbRef, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // 沿用你的 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyDZuNztwb9aLG1RqeDOyrj6KJrPhwBFi9M",
      authDomain: "fyh-pharmacy-inventory.firebaseapp.com",
      databaseURL: "https://fyh-pharmacy-inventory-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "fyh-pharmacy-inventory",
      storageBucket: "fyh-pharmacy-inventory.firebasestorage.app",
      messagingSenderId: "751378148626",
      appId: "1:751378148626:web:5a2d2be1c5f905657457cb"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);

    createApp({
        setup() {
            const rawLogs = ref([]);
            const loading = ref(true);

            onMounted(() => {
                // 抓取所有 transfer_logs
                onValue(dbRef(db, "transfer_logs"), (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        // 轉為陣列並按時間反向排序
                        rawLogs.value = Object.values(data).reverse();
                    }
                    loading.value = false;
                });
            });

            // 核心邏輯：依照日期分群
            const groupedData = computed(() => {
                const groups = {};
                rawLogs.value.forEach(log => {
                    const date = log.time.split(' ')[0]; // 取得 "2026/4/20"
                    if (!groups[date]) groups[date] = [];
                    groups[date].push(log);
                });
                // 排序日期（由新到舊）
                return Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0]));
            });

            const downloadDay = (date, logs) => {
                const formattedData = logs.map(l => ({
                    '時間': l.time,
                    '人員': l.user,
                    '藥品代碼': l.code,
                    '藥品名稱': l.name,
                    '儲位': l.shelf || '無',
                    '數量': l.qty,
                    '類別': l.isSuperUrgent ? '⚡超急' : (l.isUrgent ? '🚨急領' : (l.isER ? '🚑急診' : '一般')),
                    '處理狀態': l.processed ? '已完成' : '待處理'
                }));

                const ws = XLSX.utils.json_to_sheet(formattedData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "撥補紀錄");
                
                // 檔名轉為 YYYY-MM-DD 格式
                const fileName = `撥補報表_${date.replace(/\//g, '-')}.xlsx`;
                XLSX.writeFile(wb, fileName);
            };

            return {
                rawLogs,
                loading,
                groupedData,
                downloadDay
            };
        }
    }).mount('#app');
</script>
</body>
</html>
