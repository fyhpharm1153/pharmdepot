<!DOCTYPE html>
<html lang="zh-TW" style="font-size: 16px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Pro - UD Replenish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style type="text/tailwindcss">
        html { transition: font-size 0.2s; }
        body { @apply bg-slate-50; font-family: sans-serif; }
        .neo-card { @apply bg-white border-2 border-slate-800 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]; }
        #reader { @apply border-none overflow-hidden !important; height: 160px !important; }
        #reader video { @apply object-cover !important; height: 160px !important; width: 100% !important; }
        .overlay-start { @apply fixed inset-0 z-[500] bg-slate-900 flex flex-col items-center justify-center text-white p-8 text-center; }
        .name-popup {
            @apply fixed top-1/3 left-1/2 -translate-x-1/2 z-[600] 
                   bg-indigo-600 text-white px-6 py-4 rounded-2xl border-2 border-white
                   font-black shadow-2xl pointer-events-none text-center
                   transition-all duration-300 scale-0 opacity-0 text-xl;
        }
        .name-popup.active { @apply scale-100 opacity-100; }
    </style>
</head>
<body class="p-3 pb-24">

    <div id="big-name-popup" class="name-popup">藥名載入中</div>

    <div id="start-overlay" class="overlay-start">
        <div class="w-full max-w-xs text-center">
            <i class="fa-solid fa-barcode text-6xl mb-4 text-indigo-400"></i>
            <h2 class="text-2xl font-black mb-6">UD 條碼掃描點藥</h2>
            <select id="staff-select" class="bg-white text-slate-900 p-4 rounded-xl border-2 border-slate-800 w-full mb-6 font-black text-lg">
                <option value="" disabled selected>請選擇您的姓名</option>
            </select>
            <button id="start-btn" onclick="startSystem()" disabled class="w-full py-5 bg-indigo-600 text-white rounded-2xl font-black text-xl shadow-lg opacity-40">
                啟動相機
            </button>
        </div>
    </div>

    <div class="max-w-md mx-auto">
        <header class="mb-4 flex justify-between items-center bg-white p-3 rounded-xl border-2 border-slate-800 shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">
            <div class="flex items-center gap-3">
                <a href="https://fyhpharm1153.github.io/pharmdepot/udorder.html" class="w-8 h-8 flex items-center justify-center bg-slate-100 rounded-lg border-2 border-slate-800">
                    <i class="fa-solid fa-house text-slate-700 text-sm"></i>
                </a>
                <div class="flex flex-col leading-none">
                    <span id="user-display" class="text-sm font-black text-indigo-600 uppercase">未登入</span>
                    <span class="text-[9px] font-bold text-slate-400 uppercase mt-1 tracking-widest">Scanner Pro v4.0</span>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <div class="flex border-2 border-slate-800 rounded-lg overflow-hidden font-black text-xs">
                    <button onclick="updateGlobalFontSize(-2)" class="px-2 py-1 bg-white border-r-2 border-slate-800 active:bg-slate-200">A-</button>
                    <button onclick="updateGlobalFontSize(2)" class="px-2 py-1 bg-white active:bg-slate-200">A+</button>
                </div>
                <button onclick="fullLogout()" class="text-slate-300 p-1 text-xl"><i class="fa-solid fa-user-gear"></i></button>
            </div>
        </header>

        <div class="neo-card rounded-2xl overflow-hidden mb-4 bg-black relative min-h-[160px]">
            <div id="reader"></div>
            <div id="cam-placeholder" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center text-slate-600 z-[20]">
                <i class="fa-solid fa-video-slash text-2xl mb-2"></i>
                <span class="text-[9px] font-black uppercase tracking-widest tracking-widest">相機關閉中</span>
            </div>
            <div id="scan-line" class="absolute inset-x-0 top-1/2 h-0.5 bg-red-500/60 z-[10] pointer-events-none hidden"></div>
        </div>

        <div class="flex gap-2 mb-4">
            <button id="cam-on-btn" onclick="toggleCamera(true)" class="flex-[3] py-3 bg-indigo-600 text-white rounded-xl font-black text-sm border-2 border-slate-800 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                <i class="fa-solid fa-camera mr-1"></i> 開啟鏡頭
            </button>
            <button id="cam-switch-btn" onclick="switchCamera()" class="flex-1 py-3 bg-slate-200 text-slate-800 rounded-xl font-black text-sm border-2 border-slate-800 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
            <button id="cam-off-btn" onclick="toggleCamera(false)" class="hidden flex-[1.5] py-3 bg-red-600 text-white rounded-xl font-black text-sm border-2 border-slate-800 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>

        <div class="neo-card rounded-2xl flex flex-col bg-white overflow-hidden">
            <div class="p-3 border-b-2 border-slate-800 bg-slate-50 flex justify-between items-center text-[10px] font-black uppercase tracking-tighter">
                <div class="flex items-center gap-2">
                    <span class="text-slate-400">STATUS:</span>
                    <span id="cam-info-text" class="text-indigo-600 italic">Ready</span>
                </div>
                <div>暫存: <span id="count">0</span></div>
            </div>
            <div id="scan-list" class="flex-1 max-h-[30vh] overflow-y-auto min-h-[140px]">
                <div class="p-8 text-center text-slate-300 italic text-sm font-bold tracking-tighter">請對準條碼進行掃描</div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 backdrop-blur-md border-t-2 border-slate-100 z-40">
            <button onclick="submitBatch()" id="submit-btn" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-black text-base neo-btn disabled:opacity-30">
                確認批次發送
            </button>
        </div>
    </div>

    <audio id="beep-sound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" type="audio/mpeg">
    </audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZuNztwb9aLG1RqeDOyrj6KJrPhwBFi9M",
            authDomain: "fyh-pharmacy-inventory.firebaseapp.com",
            databaseURL: "https://fyh-pharmacy-inventory-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fyh-pharmacy-inventory",
            appId: "1:751378148626:web:5a2d2be1c5f905657457cb"
        };

        const fbApp = initializeApp(firebaseConfig);
        const db = getDatabase(fbApp);

        let inventory = [];
        let scannedItems = [];
        let html5QrCode = null;
        let selectedUser = "";
        let backCameras = []; // 用於存放所有後置鏡頭
        let currentCamIndex = 0;
        
        let baseSize = parseInt(localStorage.getItem('scanner_base_px')) || 16;
        window.updateGlobalFontSize = function(delta) {
            baseSize = Math.min(Math.max(baseSize + delta, 12), 24);
            document.documentElement.style.fontSize = baseSize + 'px';
            localStorage.setItem('scanner_base_px', baseSize);
        };
        document.documentElement.style.fontSize = baseSize + 'px';

        // 偵測並鎖定後置鏡頭
        async function initCameras() {
            try {
                const devices = await Html5Qrcode.getCameras();
                if (devices && devices.length > 0) {
                    // iPhone 上後置鏡頭通常包含 "back", "rear" 或標籤包含鏡頭編號
                    backCameras = devices.filter(d => {
                        const l = d.label.toLowerCase();
                        return l.includes('back') || l.includes('rear') || l.includes('0') || l.includes('1') || l.includes('2');
                    });
                    
                    // 如果過濾不到後置，就用原本的清單
                    if (backCameras.length === 0) backCameras = devices;
                }
            } catch (err) { console.error("Camera detection error", err); }
        }

        onValue(ref(db, "staff_list"), s => {
            const list = s.val() || ['值班人員'];
            const el = document.getElementById('staff-select');
            el.innerHTML = '<option value="" disabled selected>請選擇藥師姓名</option>' + 
                          list.map(n => `<option value="${n}">${n}</option>`).join('');
        });

        document.getElementById('staff-select').onchange = (e) => {
            selectedUser = e.target.value;
            const btn = document.getElementById('start-btn');
            btn.disabled = false; btn.classList.remove('opacity-40');
        };

        onValue(ref(db, "inventory"), s => {
            if (s.val()) inventory = Object.entries(s.val()).map(([id, v]) => ({ id, ...v }));
        });

        window.startSystem = async function() {
            if(!selectedUser) return;
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
            document.getElementById('user-display').innerText = selectedUser;
            document.getElementById('start-overlay').style.display = 'none';
            await initCameras();
            toggleCamera(true);
        };

        window.toggleCamera = async function(shouldOpen) {
            const onBtn = document.getElementById('cam-on-btn');
            const offBtn = document.getElementById('cam-off-btn');
            const swBtn = document.getElementById('cam-switch-btn');
            const placeholder = document.getElementById('cam-placeholder');
            const scanLine = document.getElementById('scan-line');
            const infoText = document.getElementById('cam-info-text');

            try {
                if (shouldOpen) {
                    if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
                    
                    // 如果還是自拍鏡頭，強制使用 environment facingMode
                    let camConfig = { facingMode: "environment" };
                    if (backCameras.length > 0) {
                        camConfig = backCameras[currentCamIndex].id;
                        infoText.innerText = backCameras[currentCamIndex].label.split('(')[0];
                    }

                    const config = { 
                        fps: 25, 
                        qrbox: { width: 250, height: 100 }, 
                        aspectRatio: 1.0,
                        videoConstraints: { focusMode: "continuous" }
                    };
                    
                    await html5QrCode.start(camConfig, config, onScanSuccess);
                    
                    placeholder.classList.add('hidden');
                    scanLine.classList.remove('hidden');
                    onBtn.classList.add('hidden');
                    offBtn.classList.remove('hidden');
                } else {
                    if (html5QrCode && html5QrCode.getState() === 2) await html5QrCode.stop();
                    placeholder.classList.remove('hidden');
                    scanLine.classList.add('hidden');
                    onBtn.classList.remove('hidden');
                    offBtn.classList.add('hidden');
                    infoText.innerText = "Paused";
                }
            } catch (err) { console.error(err); }
        };

        window.switchCamera = async function() {
            if (backCameras.length <= 1) {
                alert("此裝置未偵測到多個後置鏡頭");
                return;
            }
            if (html5QrCode && html5QrCode.getState() === 2) await html5QrCode.stop();
            
            // 延遲重啟，給 iPhone 緩衝空間
            setTimeout(() => {
                currentCamIndex = (currentCamIndex + 1) % backCameras.length;
                toggleCamera(true);
            }, 250);
        };

        function onScanSuccess(decodedText) {
            const now = Date.now();
            if (decodedText === lastCode && now - lastScanTime < 3000) return;
            lastCode = decodedText; lastScanTime = now;
            const isDuplicate = scannedItems.some(i => i.code === decodedText);
            const drug = inventory.find(i => i.code === decodedText);
            if (drug) {
                document.getElementById('beep-sound').play();
                if (isDuplicate) {
                    showPopup("點過了", true); speak("點過了");
                } else {
                    showPopup(drug.name, false); speak(drug.name);
                    scannedItems.unshift({ ...drug }); renderList();
                }
            }
        }

        function showPopup(name, isWarning) {
            const p = document.getElementById('big-name-popup');
            p.innerText = name;
            p.className = isWarning ? 'name-popup active bg-orange-500' : 'name-popup active';
            setTimeout(() => p.classList.remove('active'), 2000);
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-TW'; u.rate = 1.1;
            window.speechSynthesis.speak(u);
        }

        window.renderList = function() {
            document.getElementById('count').innerText = scannedItems.length;
            const el = document.getElementById('scan-list');
            if (scannedItems.length === 0) {
                el.innerHTML = `<div class="p-8 text-center text-slate-300 italic text-sm font-bold tracking-tighter">尚未掃描條碼...</div>`;
                return;
            }
            el.innerHTML = scannedItems.map((item, idx) => `
                <div class="flex justify-between items-center p-3 border-b-2 border-slate-100 bg-white">
                    <div class="flex-1 pr-4 leading-tight">
                        <div class="text-[10px] font-bold text-indigo-400 mb-1 tracking-tighter uppercase font-mono">${item.code}</div>
                        <div class="font-black text-slate-800 text-sm">${item.name}</div>
                    </div>
                    <button onclick="removeItem(${idx})" class="text-slate-200 p-2 text-lg"><i class="fa-solid fa-circle-minus"></i></button>
                </div>
            `).join('');
        };

        window.removeItem = (i) => { scannedItems.splice(i, 1); renderList(); };
        window.clearList = () => { if(confirm("清空？")) { scannedItems = []; renderList(); } };
        window.fullLogout = async function() {
            if (confirm("要切換帳號嗎？")) { await toggleCamera(false); document.getElementById('start-overlay').style.display = 'flex'; }
        };

        window.submitBatch = async () => {
            if (scannedItems.length === 0) return;
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "傳送中...";
            try {
                for (const item of scannedItems) {
                    await push(ref(db, "replenishment_orders"), {
                        code: item.code, name: item.name, shelf: item.shelf || 'Scanner',
                        requester: selectedUser, time: new Date().toLocaleString('zh-TW', { hour12: false }), type: 'UD_BARCODE'
                    });
                }
                alert(`批次送出成功！`); scannedItems = []; renderList();
            } catch (e) { alert("發送失敗"); } finally { btn.disabled = false; btn.innerText = "確認批次發送"; }
        };

        let lastCode = ""; let lastScanTime = 0;
    </script>
</body>
</html>
