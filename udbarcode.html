<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner - UD Replenish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style type="text/tailwindcss">
        .neo-card { @apply bg-white border-2 border-slate-800 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]; }
        .neo-btn { @apply border-2 border-slate-800 shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-x-[1px] active:translate-y-[1px] transition-all; }
        #reader { border: 4px solid #1e293b !important; border-radius: 1rem; overflow: hidden; }
        .scan-item { @apply flex justify-between items-center p-3 border-b-2 border-slate-100 bg-white; }
    </style>
</head>
<body class="bg-slate-50 p-4 pb-32">
    <div id="app" class="max-w-md mx-auto">
        <header class="mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-black text-slate-800"><i class="fa-solid fa-barcode mr-2"></i>條碼快點</h1>
            <a href="javascript:history.back()" class="text-slate-500 font-bold">返回</a>
        </header>

        <div class="neo-card rounded-2xl overflow-hidden mb-6">
            <div id="reader" class="w-full"></div>
            <div class="p-4 bg-slate-800 text-white flex justify-between items-center">
                <span class="font-bold text-sm">狀態: <span id="status-text" class="text-emerald-400">準備就緒</span></span>
                <button onclick="toggleCamera()" id="cam-btn" class="bg-white text-slate-800 px-3 py-1 rounded-lg text-xs font-black">關閉相機</button>
            </div>
        </div>

        <div class="neo-card rounded-2xl min-h-[200px] flex flex-col">
            <div class="p-3 border-b-2 border-slate-800 bg-indigo-50 flex justify-between items-center">
                <h2 class="font-black text-slate-700">本次掃描清單 (<span id="count">0</span>)</h2>
                <button onclick="clearList()" class="text-red-500 text-sm font-bold">清空</button>
            </div>
            <div id="scan-list" class="flex-1 max-h-[40vh] overflow-y-auto">
                <div class="p-10 text-center text-slate-300 italic font-bold">請對準條碼進行掃描</div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 backdrop-blur-md border-t-2 border-slate-200">
            <button onclick="submitBatch()" id="submit-btn" class="w-full max-w-md mx-auto block py-4 bg-indigo-600 text-white rounded-2xl font-black text-xl neo-btn disabled:opacity-50">
                確認批次發送 ({{count}})
            </button>
        </div>
    </div>

    <audio id="beep-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase 配置 (沿用你的配置)
        const firebaseConfig = {
            apiKey: "AIzaSyDZuNztwb9aLG1RqeDOyrj6KJrPhwBFi9M",
            authDomain: "fyh-pharmacy-inventory.firebaseapp.com",
            databaseURL: "https://fyh-pharmacy-inventory-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fyh-pharmacy-inventory",
            appId: "1:751378148626:web:5a2d2be1c5f905657457cb"
        };

        const fbApp = initializeApp(firebaseConfig);
        const db = getDatabase(fbApp);

        // 變數
        let inventory = [];
        let scannedItems = [];
        let html5QrCode;
        const currentUser = localStorage.getItem('preferred_user') || '條碼人員';

        // 取得藥品資料庫 (用來比對條碼與藥名)
        onValue(ref(db, "inventory"), s => {
            if (s.val()) {
                inventory = Object.entries(s.val()).map(([id, v]) => ({ id, ...v }));
            }
        });

        // 初始化掃描器
        function initScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 150 } }; // 一維碼適合橫向長方形

            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess
            );
        }

        // 掃描成功回呼
        let lastCode = "";
        let lastScanTime = 0;

        function onScanSuccess(decodedText) {
            const now = Date.now();
            // 防止重複掃描 (2秒內不允許掃同一個)
            if (decodedText === lastCode && now - lastScanTime < 2000) return;
            
            lastCode = decodedText;
            lastScanTime = now;

            // 尋找藥品
            const drug = inventory.find(i => i.code === decodedText);
            
            if (drug) {
                successFeedback(drug);
                scannedItems.unshift({ ...drug, scanId: now });
                renderList();
            } else {
                document.getElementById('status-text').innerText = "找不到藥品: " + decodedText;
                document.getElementById('status-text').className = "text-red-500";
            }
        }

        // 成功反饋：嗶聲 + 語音
        function successFeedback(drug) {
            // 嗶一聲
            document.getElementById('beep-sound').play();
            
            // 震動
            if (navigator.vibrate) navigator.vibrate(100);

            // 語音念藥名
            const utterance = new SpeechSynthesisUtterance(drug.name);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);

            document.getElementById('status-text').innerText = "已掃描: " + drug.name;
            document.getElementById('status-text').className = "text-emerald-500";
        }

        // 渲染清單
        window.renderList = function() {
            const listEl = document.getElementById('scan-list');
            const countEl = document.getElementById('count');
            countEl.innerText = scannedItems.length;

            if (scannedItems.length === 0) {
                listEl.innerHTML = `<div class="p-10 text-center text-slate-300 italic font-bold">請對準條碼進行掃描</div>`;
                return;
            }

            listEl.innerHTML = scannedItems.map((item, idx) => `
                <div class="scan-item">
                    <div>
                        <div class="text-xs font-bold text-slate-400">${item.code}</div>
                        <div class="font-black text-slate-800">${item.name}</div>
                    </div>
                    <button onclick="removeItem(${idx})" class="text-slate-300"><i class="fa-solid fa-circle-xmark"></i></button>
                </div>
            `).join('');
        };

        window.removeItem = (idx) => {
            scannedItems.splice(idx, 1);
            renderList();
        };

        window.clearList = () => {
            if(confirm("確定清空清單？")) {
                scannedItems = [];
                renderList();
            }
        };

        // 批次送出到 Firebase
        window.submitBatch = async () => {
            if (scannedItems.length === 0) return;
            
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "傳送中...";

            try {
                for (const item of scannedItems) {
                    await push(ref(db, "replenishment_orders"), {
                        code: item.code,
                        name: item.name,
                        shelf: item.shelf || 'Scanner',
                        requester: currentUser,
                        time: new Date().toLocaleString('zh-TW', { hour12: false }),
                        type: 'UD_BARCODE'
                    });
                }
                alert(`成功送出 ${scannedItems.length} 筆點單！`);
                scannedItems = [];
                renderList();
            } catch (e) {
                alert("傳送失敗：" + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "確認批次發送";
            }
        };

        window.toggleCamera = function() {
            const btn = document.getElementById('cam-btn');
            if (html5QrCode && html5QrCode.getState() === 2) {
                html5QrCode.stop();
                btn.innerText = "開啟相機";
                btn.className = "bg-emerald-500 text-white px-3 py-1 rounded-lg text-xs font-black";
            } else {
                initScanner();
                btn.innerText = "關閉相機";
                btn.className = "bg-white text-slate-800 px-3 py-1 rounded-lg text-xs font-black";
            }
        };

        // 啟動
        onMounted: {
            initScanner();
        }
    </script>
</body>
</html>
