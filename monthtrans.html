<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藥品撥補系統 - 數據統計版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        [v-cloak] { display: none !important; }
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .stat-card { @apply bg-white p-4 rounded-2xl border-2 border-slate-800 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]; }
        .chart-container { position: relative; height: 300px; width: 100%; }
    </style>
</head>
<body class="p-4">
    <div id="app" v-cloak class="max-w-5xl mx-auto space-y-6">
        
        <header class="stat-card flex justify-between items-center bg-indigo-600 text-white">
            <h1 class="text-2xl font-black flex items-center gap-2">
                <i class="fa-solid fa-chart-line"></i> 藥品撥補統計儀表板
            </h1>
            <div class="flex gap-2">
                <button @click="refreshData" class="bg-white/20 hover:bg-white/40 p-2 rounded-lg transition-all">
                    <i class="fa-solid fa-sync"></i>
                </button>
            </div>
        </header>

        <section class="stat-card">
            <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
                <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                    <button @click="viewMode = 'day'; updateChart();" :class="viewMode === 'day' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'" class="px-4 py-2 rounded-lg font-bold transition-all">日統計</button>
                    <button @click="viewMode = 'month'; updateChart();" :class="viewMode === 'month' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'" class="px-4 py-2 rounded-lg font-bold transition-all">月統計</button>
                </div>
                <div class="text-slate-500 font-bold text-sm">
                    數據來源：Firebase Realtime Database
                </div>
            </div>

            <div class="chart-container">
                <canvas id="mainChart"></canvas>
            </div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="stat-card border-l-8 border-l-blue-500">
                <p class="text-slate-500 font-bold">今日撥補總量</p>
                <h2 class="text-3xl font-black text-slate-800">{{ todayCount }} <span class="text-sm">筆</span></h2>
            </div>
            <div class="stat-card border-l-8 border-l-purple-500">
                <p class="text-slate-500 font-bold">本月撥補總量</p>
                <h2 class="text-3xl font-black text-slate-800">{{ monthCount }} <span class="text-sm">筆</span></h2>
            </div>
            <div class="stat-card border-l-8 border-l-orange-500">
                <p class="text-slate-500 font-bold">最常撥補藥品</p>
                <h2 class="text-xl font-black text-slate-800">{{ topDrug }}</h2>
            </div>
        </div>

    </div>

    <script>
        // Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyDZuNztwb9aLG1RqeDOyrj6KJrPhwBFi9M",
            authDomain: "fyh-pharmacy-inventory.firebaseapp.com",
            databaseURL: "https://fyh-pharmacy-inventory-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fyh-pharmacy-inventory",
            storageBucket: "fyh-pharmacy-inventory.firebasestorage.app",
            messagingSenderId: "751378148626",
            appId: "1:751378148626:web:5a2d2be1c5f905657457cb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const { createApp, ref, onMounted, computed } = Vue;

        createApp({
            setup() {
                const allLogs = ref([]);
                const viewMode = ref('day'); // 'day' 或 'month'
                const todayCount = ref(0);
                const monthCount = ref(0);
                const topDrug = ref('統計中...');
                let myChart = null;

                const fetchData = async () => {
                    const snapshot = await db.ref("transfer_logs").once("value");
                    if (snapshot.exists()) {
                        allLogs.value = Object.values(snapshot.val());
                        calculateSummary();
                        updateChart();
                    }
                };

                const calculateSummary = () => {
                    const now = new Date();
                    const todayStr = now.toLocaleDateString('zh-TW');
                    const monthPrefix = `${now.getFullYear()}/${now.getMonth() + 1}`;

                    // 今日筆數
                    todayCount.value = allLogs.value.filter(l => l.time.includes(todayStr)).length;
                    
                    // 本月筆數
                    monthCount.value = allLogs.value.filter(l => l.time.includes(monthPrefix)).length;

                    // 最常撥補
                    const counts = {};
                    allLogs.value.forEach(l => { counts[l.name] = (counts[l.name] || 0) + 1; });
                    const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
                    topDrug.value = sorted.length ? sorted[0][0] : '無數據';
                };

                const updateChart = () => {
                    const ctx = document.getElementById('mainChart').getContext('2d');
                    let labels = [];
                    let dataValues = [];
                    let labelName = "";

                    if (viewMode.value === 'day') {
                        // 統計最近 7 天
                        labelName = "每日撥補件數";
                        const last7Days = [...Array(7)].map((_, i) => {
                            const d = new Date();
                            d.setDate(d.getDate() - (6 - i));
                            return d.toLocaleDateString('zh-TW');
                        });
                        labels = last7Days.map(d => d.split('/')[2] + '日');
                        dataValues = last7Days.map(dayStr => allLogs.value.filter(l => l.time.includes(dayStr)).length);
                    } else {
                        // 統計年度各月 (1-12月)
                        labelName = "每月撥補總量";
                        const year = new Date().getFullYear();
                        labels = [...Array(12)].map((_, i) => `${i+1}月`);
                        dataValues = labels.map((_, i) => {
                            const monthStr = `${year}/${i + 1}/`;
                            return allLogs.value.filter(l => l.time.includes(monthStr)).length;
                        });
                    }

                    if (myChart) myChart.destroy();

                    myChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: labelName,
                                data: dataValues,
                                borderColor: '#4f46e5',
                                backgroundColor: 'rgba(79, 70, 229, 0.1)',
                                borderWidth: 4,
                                fill: true,
                                tension: 0.4,
                                pointRadius: 5,
                                pointBackgroundColor: '#4f46e5'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                y: { beginAtZero: true, grid: { display: false } },
                                x: { grid: { display: false } }
                            }
                        }
                    });
                };

                onMounted(() => {
                    fetchData();
                });

                return {
                    viewMode, todayCount, monthCount, topDrug,
                    refreshData: fetchData, updateChart
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
