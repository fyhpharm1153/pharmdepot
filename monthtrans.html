<!DOCTYPE html>
<html lang="zh-TW" style="font-size: 1.1rem;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>藥品撥補系統 - 營運管理版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style type="text/tailwindcss">
        [v-cloak] { display: none !important; }
        body { background-color: #f1f5f9; transition: all 0.2s; font-family: sans-serif; }
        .calc-btn { 
            @apply flex items-center justify-center text-3xl font-black rounded-xl border-2 border-slate-800 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all active:shadow-none active:translate-x-[2px] active:translate-y-[2px];
            height: 70px;
        }
        .btn-num { @apply bg-white text-slate-900; }
        .btn-op { @apply bg-orange-400 text-white; }
        .btn-ac { @apply bg-red-600 text-white; }
        .btn-del { @apply bg-red-400 text-white; }
        .btn-equal { @apply bg-blue-600 text-white; }
        .btn-sign { @apply bg-slate-500 text-white; }
        .suggestion-item.highlighted { @apply bg-blue-600 text-white border-l-8 border-blue-900 scale-[1.01] z-10 font-black; }
        .record-card { border-left: 8px solid #cbd5e1; }
        .modal-overlay { @apply fixed inset-0 z-[150] flex items-center justify-center p-6 bg-black/80 backdrop-blur-sm; }
        .qty-display:focus { @apply border-blue-600 ring-4 ring-blue-200 outline-none bg-blue-50; }
        .push-notify { 
            @apply fixed left-4 top-1/2 -translate-y-1/2 z-[200];
            @apply bg-red-600 text-white p-4 rounded-full shadow-2xl flex items-center justify-center border-2 border-white cursor-pointer hover:bg-red-700 transition-all;
            width: 70px; height: 70px;
        }
        .urgent-pulse { animation: pulse 1.2s infinite; @apply border-2 border-red-600 cursor-pointer; }
        @keyframes pulse { 0% { transform: scale(1); } 70% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="p-4 pb-20">
    <div id="app" class="max-w-7xl mx-auto" v-cloak>
        
        <div v-if="pendingUrgent.length > 0" class="push-notify animate-bounce" @click="scrollToUrgent">
            <i class="fa-solid fa-triangle-exclamation text-4xl"></i>
        </div>

        <header class="flex flex-wrap justify-between items-center mb-6 gap-4 bg-white p-4 rounded-2xl border-2 border-slate-800 shadow-[5px_5px_0px_0px_rgba(0,0,0,0.1)]">
            <div class="flex items-center gap-3">
                <button @click="goBack" class="w-12 h-12 border-2 border-slate-800 rounded-xl bg-white flex items-center justify-center shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <h1 class="text-2xl font-black text-slate-800">藥品撥補管理系統</h1>
            </div>
            <div class="flex gap-2">
                <button @click="changeFontSize(-0.1)" class="px-4 py-1 border-2 border-slate-800 rounded-xl font-bold bg-white shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">A-</button>
                <button @click="changeFontSize(0.1)" class="px-4 py-1 border-2 border-slate-800 rounded-xl font-bold bg-white shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">A+</button>
                <button @click="showManager = true" class="w-12 h-12 bg-slate-800 text-white border-2 border-slate-800 rounded-xl flex items-center justify-center shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">
                    <i class="fa-solid fa-cog"></i>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start mb-8 text-[1em]">
            <section class="bg-white p-6 rounded-[2rem] border-2 border-slate-800 shadow-xl space-y-5">
                <div>
                    <label class="font-bold text-slate-500 block mb-1 text-lg">撥補人員</label>
                    <select v-model="form.user" @change="saveUserPreference" class="w-full bg-slate-100 p-4 rounded-xl font-black text-xl border-2 border-slate-300 text-slate-800">
                        <option value="值班人員">值班人員</option>
                        <option v-for="user in staffList" :key="user" :value="user">{{ user }}</option>
                    </select>
                </div>

                <div class="relative">
                    <label class="font-bold text-slate-500 block mb-1 text-lg">搜尋藥品</label>
                    <div class="relative flex items-center">
                        <input v-model="searchQuery" ref="searchInput" @input="onSearchInput" 
                               @keydown.down.prevent="moveHighlight(1)" @keydown.up.prevent="moveHighlight(-1)" 
                               @keydown.enter.prevent="confirmSelection"
                               placeholder="輸入代碼或名稱..." class="w-full bg-slate-100 p-4 rounded-xl font-black text-xl border-2 border-slate-300 outline-none focus:border-blue-600 transition-all">
                        <button v-if="searchQuery" @click="clearSearch" class="absolute right-4 text-slate-400 hover:text-red-500"><i class="fa-solid fa-circle-xmark text-2xl"></i></button>
                    </div>
                    <div v-if="suggestions.length > 0" class="absolute z-50 w-full bg-white shadow-2xl rounded-xl mt-2 border-2 border-slate-800 max-h-60 overflow-y-auto">
                        <div v-for="(s, index) in suggestions" :key="s.c + index" @click="selectDrug(s)" 
                             :class="['suggestion-item p-4 border-b border-slate-100 flex justify-between items-center cursor-pointer transition-all', highlightIndex === index ? 'highlighted' : '']">
                            <div>
                                <div class="text-blue-600 font-bold text-sm">{{ s.c }}</div>
                                <div class="text-xl font-black text-slate-800">{{ s.n }}</div>
                            </div>
                            <div class="bg-orange-100 text-orange-700 px-3 py-1 rounded-lg text-sm font-bold">儲位：{{ s.s || '?' }}</div>
                        </div>
                    </div>
                </div>

                <div v-if="form.name" class="bg-blue-700 p-5 rounded-xl border-2 border-slate-800 shadow-inner space-y-3">
                    <p class="font-black text-white text-xl">已選：[{{ form.code }}] {{ form.name }}</p>
                    <div class="grid grid-cols-3 gap-3">
                        <label class="flex items-center gap-2 bg-white/10 p-2 rounded-lg border border-white/20 cursor-pointer text-white font-bold">
                            <input type="checkbox" v-model="form.isSuperUrgent" @change="handleUrgentCheck('super')"> ⚡超急
                        </label>
                        <label class="flex items-center gap-2 bg-white/10 p-2 rounded-lg border border-white/20 cursor-pointer text-white font-bold">
                            <input type="checkbox" v-model="form.isUrgent" @change="handleUrgentCheck('urgent')"> 🚨急領
                        </label>
                        <label class="flex items-center gap-2 bg-white/10 p-2 rounded-lg border border-white/20 cursor-pointer text-white font-bold">
                            <input type="checkbox" v-model="form.isER"> 🚑急診
                        </label>
                    </div>
                </div>

                <div v-if="(!form.isUrgent && !form.isER) || form.isSuperUrgent" class="bg-slate-200 p-5 rounded-[2rem] border-2 border-slate-800">
                    <div ref="qtyDisplay" tabindex="0" class="qty-display bg-white p-4 rounded-xl border-2 border-slate-800 mb-4 text-right text-4xl font-black text-slate-900 min-h-[1.5em]">
                        {{ form.qtyStr || '0' }}
                    </div>
                    <div class="grid grid-cols-4 gap-3">
                        <button v-for="btn in ['AC','DEL','/','7','8','9','*','4','5','6','-','1','2','3','+']" @click="handleCalcClick('form', btn)" :class="getBtnClass(btn)">{{ getBtnLabel(btn) }}</button>
                        <button @click="addNum('form','0')" class="calc-btn btn-num col-span-2">0</button>
                        <button @click="calculate('form')" class="calc-btn btn-equal text-5xl">=</button>
                    </div>
                </div>
                <button @click="submitRecord" class="w-full bg-emerald-600 text-white py-6 rounded-2xl font-black text-3xl border-4 border-slate-800 shadow-[6px_6px_0px_0px_rgba(0,0,0,0.2)] active:translate-x-1 active:translate-y-1">確認提交</button>
            </section>

            <section id="historySection" class="space-y-6">
                <div class="bg-white p-6 rounded-[2rem] border-2 border-slate-800 shadow-xl space-y-4">
                    <h3 class="font-black text-xl text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-file-excel text-green-600"></i> 報表匯出中心
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                            <label class="block text-sm font-bold text-slate-500 mb-2">單日報表</label>
                            <input type="date" v-model="filterDate" class="w-full p-2 border-2 border-slate-300 rounded-lg mb-2 font-bold">
                            <button @click="exportByDate" class="w-full bg-slate-800 text-white py-2 rounded-lg font-bold text-sm hover:bg-black transition-all">下載日報表</button>
                        </div>
                        <div class="p-4 bg-blue-50 rounded-xl border border-blue-100">
                            <label class="block text-sm font-bold text-blue-500 mb-2">整月總表</label>
                            <input type="month" v-model="filterMonth" class="w-full p-2 border-2 border-blue-200 rounded-lg mb-2 font-bold text-blue-800">
                            <button @click="exportByMonth" class="w-full bg-blue-700 text-white py-2 rounded-lg font-bold text-sm hover:bg-blue-900 transition-all shadow-md">下載整月報表</button>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-xl border-2 border-slate-800 shadow-md">
                    <h3 class="font-black text-xl text-slate-600 mb-4">最近 20 筆紀錄</h3>
                    <div class="max-h-[500px] overflow-y-auto space-y-3">
                        <div v-for="log in filteredHistory" :key="log.id" class="record-card bg-white p-4 rounded-xl border-2 border-slate-200 flex items-center justify-between">
                            <div>
                                <div class="text-xs font-bold text-slate-400">{{ log.time }} - {{ log.user }}</div>
                                <div class="font-black text-slate-800 text-lg">[{{ log.code }}] {{ log.name }}</div>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-2xl font-black" :class="log.isUrgent ? 'text-red-500' : 'text-blue-600'">{{ log.qty }}</span>
                                <button @click="deleteSingle(log)" class="text-red-300 hover:text-red-600"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div v-if="showManager" class="modal-overlay">
            <div class="bg-white w-full max-w-md rounded-3xl p-8 border-4 border-slate-800 shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="font-black text-2xl">系統設定</h2>
                    <button @click="showManager = false" class="text-4xl">&times;</button>
                </div>
                <p class="text-slate-500 font-bold mb-4">撥補人員管理</p>
                <div class="flex gap-2 mb-4">
                    <input v-model="newStaffName" placeholder="姓名" class="flex-1 p-2 border-2 rounded-lg">
                    <button @click="addStaff" class="bg-blue-600 text-white px-4 rounded-lg font-bold">新增</button>
                </div>
                <div class="max-h-40 overflow-y-auto border rounded-lg p-2">
                    <div v-for="(name, idx) in staffList" :key="idx" class="flex justify-between py-1 border-b">
                        <span class="font-bold">{{ name }}</span>
                        <button @click="removeStaff(idx)" class="text-red-500 text-sm">刪除</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    import { createApp, ref, computed, onMounted, watch, nextTick } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref as dbRef, push, remove, query, limitToLast, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Firebase 配置 (與您原本相同)
    const firebaseConfig = {
      apiKey: "AIzaSyDZuNztwb9aLG1RqeDOyrj6KJrPhwBFi9M",
      authDomain: "fyh-pharmacy-inventory.firebaseapp.com",
      databaseURL: "https://fyh-pharmacy-inventory-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "fyh-pharmacy-inventory",
      storageBucket: "fyh-pharmacy-inventory.firebasestorage.app",
      messagingSenderId: "751378148626",
      appId: "1:751378148626:web:5a2d2be1c5f905657457cb"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);

    createApp({
        setup() {
            const form = ref({ user: '值班人員', code: '', name: '', shelf: '', qtyStr: '', isUrgent: false, isSuperUrgent: false, isER: false });
            const searchQuery = ref('');
            const warehouseList = ref([]);
            const history = ref([]);
            const staffList = ref([]);
            const showManager = ref(false);
            const filterDate = ref(new Date().toISOString().split('T')[0]);
            const filterMonth = ref(new Date().toISOString().slice(0, 7)); // 月份篩選器 (YYYY-MM)
            const suggestions = ref([]);
            const highlightIndex = ref(-1);
            const searchInput = ref(null);
            const newStaffName = ref('');
            const baseFontSize = ref(1.1);

            // 初始化與資料同步
            onMounted(() => {
                onValue(dbRef(db, "warehouse"), s => { warehouseList.value = s.val() ? Object.values(s.val()) : []; });
                onValue(query(dbRef(db, "transfer_logs"), limitToLast(200)), s => {
                    history.value = s.val() ? Object.entries(s.val()).map(([id, v]) => ({ id, ...v })).reverse() : [];
                });
                onValue(dbRef(db, "staff_list"), s => { if(s.val()) staffList.value = s.val(); });
            });

            // 搜尋邏輯
            const onSearchInput = () => {
                const k = searchQuery.value.toLowerCase().trim();
                suggestions.value = k ? warehouseList.value.filter(i => i.n?.toLowerCase().includes(k) || i.c?.toLowerCase().includes(k)).slice(0, 10) : [];
            };

            const selectDrug = (d) => {
                form.value.code = d.c; form.value.name = d.n; form.value.shelf = d.s || '無';
                searchQuery.value = d.n; suggestions.value = [];
            };

            // 提交資料
            const submitRecord = async () => {
                if(!form.value.name) return;
                const q = Number(form.value.qtyStr) || 0;
                await push(dbRef(db, "transfer_logs"), {
                    time: new Date().toLocaleString('zh-TW', { hour12: false }),
                    user: form.value.user, code: form.value.code, name: form.value.name,
                    shelf: form.value.shelf, qty: q, isUrgent: form.value.isUrgent,
                    isSuperUrgent: form.value.isSuperUrgent, isER: form.value.isER, processed: false
                });
                form.value.qtyStr = ''; form.value.name = ''; searchQuery.value = '';
            };

            // 【核心功能】匯出單日報表
            const exportByDate = async () => {
                const s = await get(dbRef(db, "transfer_logs"));
                if (!s.val()) return alert("尚無資料");
                const d = filterDate.value.replace(/-/g, '/');
                const logs = Object.values(s.val()).filter(l => l.time.includes(d));
                if (logs.length === 0) return alert("該日無紀錄");
                generateExcel(logs, `撥補報表_${filterDate.value}`);
            };

            // 【核心功能】匯出整月報表
            const exportByMonth = async () => {
                const s = await get(dbRef(db, "transfer_logs"));
                if (!s.val()) return alert("資料庫內無資料");
                
                const [targetYear, targetMonth] = filterMonth.value.split('-').map(Number);
                const logs = Object.values(s.val()).filter(l => {
                    const datePart = l.time.split(' ')[0];
                    const parts = datePart.split('/');
                    return Number(parts[0]) === targetYear && Number(parts[1]) === targetMonth;
                }).sort((a, b) => new Date(a.time.replace(/\//g, '-')) - new Date(b.time.replace(/\//g, '-')));

                if (logs.length === 0) return alert(`${filterMonth.value} 無紀錄`);
                generateExcel(logs, `${targetYear - 1911}年${targetMonth}月_撥補總報表`);
            };

            // Excel 產生工具
            const generateExcel = (logs, fileName) => {
                const data = logs.map(l => ({
                    '時間': l.time,
                    '人員': l.user,
                    '代碼': l.code,
                    '名稱': l.name,
                    '數量': l.qty,
                    '儲位': l.shelf || '-',
                    '類型': l.isSuperUrgent ? '⚡超急' : (l.isUrgent ? '🚨急領' : (l.isER ? '🚑急診' : '一般'))
                }));
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "報表內容");
                XLSX.writeFile(wb, `${fileName}.xlsx`);
            };

            // 輔助函式 (與原程式邏輯相同)
            const handleCalcClick = (t, b) => {
                if(b==='AC') form.value.qtyStr = '';
                else if(b==='DEL') form.value.qtyStr = form.value.qtyStr.slice(0, -1);
                else if(['/','*','-','+'].includes(b)) form.value.qtyStr += b;
                else form.value.qtyStr += b;
            };

            return {
                form, searchQuery, suggestions, highlightIndex, history, filterDate, filterMonth, showManager, staffList, newStaffName,
                onSearchInput, selectDrug, submitRecord, exportByDate, exportByMonth, handleCalcClick,
                getBtnClass: (b) => (['/','*','-','+'].includes(b)?'calc-btn btn-op':(b==='AC'?'calc-btn btn-ac':(b==='DEL'?'calc-btn btn-del':'calc-btn btn-num'))),
                getBtnLabel: (b) => b==='*'?'×':(b==='/'?'÷':(b==='DEL'?'←':b)),
                calculate: () => { try { form.value.qtyStr = eval(form.value.qtyStr).toString(); } catch { form.value.qtyStr = ''; } },
                addNum: (t, n) => form.value.qtyStr += n,
                deleteSingle: async (l) => { if(confirm("刪除此紀錄？")) await remove(dbRef(db, `transfer_logs/${l.id}`)); },
                goBack: () => window.history.back(),
                changeFontSize: (v) => { baseFontSize.value += v; document.documentElement.style.fontSize = `${baseFontSize.value}rem`; },
                addStaff: () => { staffList.value.push(newStaffName.value); set(dbRef(db, "staff_list"), staffList.value); newStaffName.value = ''; },
                removeStaff: (i) => { staffList.value.splice(i,1); set(dbRef(db, "staff_list"), staffList.value); },
                pendingUrgent: computed(() => history.value.filter(l => (l.isUrgent || l.isSuperUrgent) && !l.processed)),
                filteredHistory: computed(() => history.value.slice(0, 20)),
                clearSearch: () => { searchQuery.value = ''; suggestions.value = []; },
                handleUrgentCheck: (type) => { /* 保持原有的 12 小時重複比對邏輯可以放在這裡 */ }
            };
        }
    }).mount('#app');
</script>
</body>
</html>
