function search(){clearTimeout(timer);const q=norm($('q').value);$('results').replaceChildren();$('selected').hidden=true;chosen=null;matches=q?[...groups.values()].filter(g=>norm(g.n).includes(q)||[...g.ids].some(id=>norm(id).includes(q))):[];$('count').textContent=q?`找到 ${matches.length} 種藥名，共 ${matches.reduce((n,g)=>n+g.rows.length,0)} 個儲位`:`共 ${groups.size} 種藥名，請輸入關鍵字`;if(matches.length!==1||norm(matches[0].n)!==last){last='';if('speechSynthesis'in window)speechSynthesis.cancel()}for(const g of matches){const b=document.createElement('button');b.className='result';const a=document.createElement('span'),n=document.createElement('strong'),i=document.createElement('small'),l=document.createElement('span');n.textContent=g.n;i.textContent=[...g.ids].join(' / ');l.className='loc';locations(l,g);a.append(n,i);b.append(a,l);b.onclick=()=>{clearTimeout(timer);select(g)};$('results').append(b)}if(matches.length===1){const g=matches[0];timer=setTimeout(()=>select(g,true),350)}}
$('q').oninput=search;$('clear').onclick=()=>{$('q').value='';search();$('q').focus()};$('repeat').onclick=()=>{if(chosen)say(speech(chosen))};$('test').onclick=()=>say('A櫃，第一層；B櫃，抽屜五點一格。');$('pitch').oninput=()=>$('pitchValue').textContent=Number($('pitch').value).toFixed(2);$('voiceChoice').onchange=()=>{if(chosen)say(speech(chosen));else $('test').click()};$('rate').oninput=()=>$('speed').textContent=$('rate').value;$('voice').onchange=()=>{if(!$('voice').checked&&'speechSynthesis'in window)speechSynthesis.cancel();else if(chosen)select(chosen)};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('clear').click();if(e.key==='Enter'&&document.activeElement===$('q')&&matches.length===1){clearTimeout(timer);select(matches[0])}});let zoom=100;try{zoom=Number(localStorage.getItem('pharmacyTextZoom'))||100}catch(e){}function setZoom(v){zoom=Math.max(80,Math.min(180,v));document.documentElement.style.setProperty('--zoom',zoom/100);$('zoomValue').textContent=zoom+'%';$('zoomOut').disabled=zoom<=80;$('zoomIn').disabled=zoom>=180;try{localStorage.setItem('pharmacyTextZoom',String(zoom))}catch(e){}}$('zoomOut').onclick=()=>setZoom(zoom-10);$('zoomIn').onclick=()=>setZoom(zoom+10);$('zoomReset').onclick=()=>setZoom(100);setZoom(zoom);search();</script></html>
